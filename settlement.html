/* ═══════════════════════════════════════════════════════════
   볼살씨 — 정산판 탭 (PRD_v3 4장)

   스케줄 탭(index.html)과 같은 신문 지면 미감으로 통일했다.
   토큰·질감·타이포는 index.html과 동일하게 유지할 것 — 한쪽만 고치지 말 것.

   집계는 배우별 단순 관람 횟수(/N회), 페어 정산 아님.
   좌석배치도는 등급색 없이 단색, 방문한 좌석만 유저가 고른 색으로 방문 횟수만큼 진하게.
   ═══════════════════════════════════════════════════════════ */

:root {
  --paper:#e9e3d5; --paper-2:#e3dccb; --paper-3:#ded7c6;
  --ink:#17150f;
  /* 텍스트용 — 종이색(--paper) 위에서 최소 WCAG AA 근처 대비를 확보한 값 */
  --ink-72:rgba(23,21,15,.9);  --ink-60:rgba(23,21,15,.84);
  --ink-55:rgba(23,21,15,.78); --ink-45:rgba(23,21,15,.7);
  /* 아래 둘은 선·테두리 전용 (텍스트에 쓰지 말 것) */
  --ink-40:rgba(23,21,15,.4);  --ink-28:rgba(23,21,15,.28);
  --ink-14:rgba(23,21,15,.14);
  --accent:#8f2e22;

  /* 신문 종이 질감 — SVG 난류로 만든 구김(음영)과 잉크 그레인. 외부 이미지 없음 */
  --crumple:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='560' height='560'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.017' numOctaves='5' seed='9' stitchTiles='stitch' result='t'/><feDiffuseLighting in='t' lighting-color='%23fff' surfaceScale='3.2' diffuseConstant='1'><feDistantLight azimuth='58' elevation='56'/></feDiffuseLighting></filter><rect width='560' height='560' filter='url(%23p)'/><rect width='560' height='560' fill='%23fff' opacity='.5'/></svg>");
  --grain:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='150' height='150' fill='%23fff'/><rect width='150' height='150' filter='url(%23g)' opacity='.3'/></svg>");

  /* 폰트는 themes/elisabeth-2026-6th-lucheni/fonts/fonts.css 에서 로컬 로드 (이 PC는 웹폰트 CDN 이 막힘).
     본문은 카페24 써라운드 에어 — 둥근 획의 고딕. 못 받으면 시스템 고딕으로 폴백.
     헤드라인 한글은 Hahmlet, 라틴은 Playfair 로 신문 인상을 낸다. */
  --fraktur:"UnifrakturMaguntia","Hahmlet","Batang",serif;
  --display:"Playfair Display","Hahmlet","Malgun Gothic","Apple SD Gothic Neo",serif;
  --body:"Cafe24 Ssurround Air","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  /* 숫자·라틴은 IBM Plex Mono, 그 안의 한글은 본문과 같은 카페24 써라운드 에어로 폴백 */
  --mono:"IBM Plex Mono","Cafe24 Ssurround Air","D2Coding",ui-monospace,monospace;
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  background-color:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:14px; font-weight:600; line-height:1.6;
  font-synthesis:weight;
  -webkit-font-smoothing:antialiased;
  background-image:
    var(--grain),
    var(--crumple),
    radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.5), rgba(0,0,0,0) 55%),
    radial-gradient(100% 50% at 50% 100%, rgba(90,78,55,.14), rgba(0,0,0,0) 70%);
  background-size:150px 150px, 560px 560px, auto, auto;
  background-repeat:repeat, repeat, no-repeat, no-repeat;
  background-blend-mode:multiply, multiply, normal, normal;
  background-attachment:scroll;
  overscroll-behavior-y:auto;
}
button, input, select, textarea { font-weight:600; }
[hidden] { display:none !important; }
.mono { font-family:var(--mono); }
a { color:var(--accent); text-decoration:none; }

.np-shell {
  --pad:18px;
  max-width:600px; margin:0 auto; min-height:100vh;
  padding:0 var(--pad); display:flex; flex-direction:column;
}
@media (min-width:640px) { .np-shell { border-inline:1px solid var(--ink-14); } }

/* ═══ 마스트헤드 ═══ */
.np-mast { position:relative; flex:none; padding:18px 0 10px; text-align:center; border-bottom:3px double var(--ink); }
.np-login {
  position:absolute; top:14px;
  border:1px solid var(--ink-40); background:none; color:var(--ink);
  font-family:var(--mono); font-size:12px; letter-spacing:.12em;
  min-height:40px; padding:4px 10px; cursor:pointer;
  right:0;

  z-index:20;
  pointer-events:auto;
  isolation:isolate;}
.np-login:hover { background:var(--ink); color:var(--paper); }
.np-wordmark { font-family:var(--fraktur); font-weight:400; font-size:29px; line-height:1.05; letter-spacing:.01em; margin:2px 0 4px; text-wrap:balance; }
.np-byline {
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  padding-top:6px; border-top:1px solid var(--ink-40);
  font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--ink-60);
}
.np-byline > :first-child { text-align:left; }
.np-byline > :last-child { text-align:right; }
.np-byline .by-name { text-align:center; color:#6B3FA0; font-weight:600; }
.np-mast-slug {
  margin-top:7px; padding-top:6px; border-top:1px solid var(--ink-14);
  font-family:var(--body); font-size:12px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-55); line-height:1.55;
}

/* ═══ 탭 ═══ */
.np-nav {
  flex:none; display:flex; gap:18px; justify-content:center;
  padding:9px 0; border-bottom:1px solid var(--ink-28);
  font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
}
.np-nav [aria-current] { color:var(--ink); border-bottom:2px solid var(--accent); padding-bottom:3px; }
.np-nav a { color:var(--ink-55); }
.np-nav a:hover { color:var(--ink); }

.np-main { flex:1; padding:14px 0 28px; }

.np-foot { flex:none; border-top:3px double var(--ink); padding:12px 0 26px; }
.np-foot p { font-family:var(--mono); font-size:12px; line-height:1.7; letter-spacing:.03em; color:var(--ink-55); }

/* ═══ 지면 헤드 — 포스터 + 제호 ═══ */
.st-head {
  display:grid; grid-template-columns:64px 1fr; gap:14px; align-items:center;
  padding:4px 0 14px; border-bottom:1px solid var(--ink-28);
}
.st-poster {
  width:64px; height:64px; border-radius:50%; flex:none;
  border:1px solid var(--ink-40); background:var(--paper-3) center/cover no-repeat;
}
.st-kick { font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--accent); text-transform:uppercase; }
.st-title { font-family:var(--display); font-weight:900; font-size:26px; line-height:1.12; letter-spacing:-.01em; margin:4px 0 5px; }
.st-meta { font-family:var(--mono); font-size:12px; letter-spacing:.04em; color:var(--ink-60); line-height:1.6; }

/* ═══ 섹션 ═══ */
.st-sec { margin-top:16px; border-top:3px double var(--ink); padding-top:12px; }
.st-sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:9px; }
.st-sec-head h2, .st-sec-head h3 { font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.01em; }
.st-sec-head .cnt { font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--ink-55); }
.st-note { font-family:var(--mono); font-size:12px; line-height:1.7; letter-spacing:.02em; color:var(--ink-55); }
.field-lbl { font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--ink-55); text-transform:uppercase; margin:0 0 7px; }

/* ═══ 버튼 ═══ */
.np-btn {
  border:1px solid var(--ink); background:none; color:var(--ink); cursor:pointer;
  font-family:var(--mono); font-size:12px; letter-spacing:.1em; padding:9px 14px;
}
.np-btn.solid { background:var(--ink); color:var(--paper); }
.np-btn.ghost { border-color:var(--ink-40); }
.np-btn.sm { font-size:12px; padding:6px 10px; }
.np-btn:disabled { opacity:.4; cursor:not-allowed; }
.np-btn:not(:disabled):hover { background:var(--ink); color:var(--paper); border-color:var(--ink); }

/* ═══ 고정 토글 (📌 강홍석) ═══ */
.st-pin { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:14px; }
.st-pin .pin { font-size:15px; line-height:1; }
.st-toggle {
  border:1px solid var(--ink-40); background:none; color:var(--ink-60); cursor:pointer;
  font-family:var(--mono); font-size:12px; letter-spacing:.08em; padding:6px 13px;
}
.st-toggle[aria-pressed="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
.st-all-note { font-family:var(--mono); font-size:12px; color:var(--accent); }

/* ═══ 집계 ═══ */
.st-tally {
  display:flex; flex-direction:column; gap:10px;
  padding:12px 0 14px; border-top:1px solid var(--ink-14); border-bottom:1px solid var(--ink-14); margin-bottom:16px;
}
.st-tally-main { display:flex; align-items:baseline; gap:10px; width:100%; }
.st-tally .who { font-family:var(--display); font-weight:700; font-size:14px; }
.st-tally .n { font-family:var(--mono); font-size:28px; font-weight:600; line-height:1; margin-left:auto; }
.st-tally .n small { font-size:12px; color:var(--ink-55); }
.st-period-filter {
  display:flex; align-items:center; gap:7px; width:max-content; max-width:100%; cursor:pointer;
  font-family:var(--mono); font-size:12px; color:var(--ink-60);
}
.st-period-filter input { width:15px; height:15px; margin:0; accent-color:var(--ink); cursor:pointer; }
.st-period-filter b { color:var(--ink); font-weight:600; }
.st-period-filter small { color:var(--ink-55); font-size:11px; }

/* ═══ 좌석 배치도 ═══
   좌석번호를 그대로 grid-column으로 써서 실제 부채꼴 배열이 나온다. */
.st-floor { margin-top:14px; }
.st-floor + .st-floor { margin-top:18px; padding-top:14px; border-top:1px dashed var(--ink-28); }
.st-floor-lbl {
  display:inline-block; margin-bottom:6px; padding:2px 8px;
  border:1px solid var(--ink-40); font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--ink-60);
}
.stage-bar {
  margin:2px 0 9px; padding:4px 0; text-align:center;
  background:var(--ink-14); border:1px solid var(--ink-28);
  font-family:var(--mono); font-size:12px; letter-spacing:.4em; color:var(--ink-60);
}
/* 배치도는 읽기 전용 — 누르는 곳이 아니므로 손가락 커서를 쓰지 않는다. */
.seatmap-scroll { position:relative; }
/* 배경을 평평한 종이색으로 깔아 좌석 사이 미세 틈으로 종이 질감이 비쳐 흔들리는 걸 막는다 */
.seatmap { position:relative; display:flex; flex-direction:column; padding-bottom:4px; background:var(--paper); }
.seatrow { display:grid; grid-template-rows:var(--seat-h, var(--seat)); height:var(--seat-h, var(--seat)); align-items:stretch; justify-items:stretch; width:max-content; gap:0; }
/* 공유 경계는 위/왼쪽만 그리고, 노출된 아래/오른쪽만 더한다. */
.seat {
  width:var(--seat); height:var(--seat-h, var(--seat));
  min-width:var(--seat); min-height:var(--seat-h, var(--seat));
  max-width:var(--seat); max-height:var(--seat-h, var(--seat));
  border:0; box-sizing:border-box;
  --stroke:1px; --stroke-l:var(--ink-40); --stroke-t:var(--ink-40); --stroke-e:var(--ink-40);
  --stroke-r:transparent; --stroke-b:transparent;
  background-color:var(--paper-3);
  border-style:solid;
  border-width:var(--stroke);
  border-color:var(--stroke-t) var(--stroke-r) var(--stroke-b) var(--stroke-l);
  cursor:default;
  display:grid; place-items:center; grid-row:1; align-self:stretch; justify-self:stretch;
  font-family:var(--mono); line-height:1; padding:0;
}
.seat.edge-r { --stroke-r:var(--stroke-e); }
.seat.edge-b { --stroke-b:var(--stroke-e); }
.seat.strong-l { --stroke-l:var(--ink-55); }
.seat.strong-t { --stroke-t:var(--ink-55); }
.rl {
  font-family:var(--mono); font-size:calc(var(--seat) * .6); line-height:1;
  color:var(--ink-55); text-align:center; white-space:nowrap; align-self:center; grid-row:1;
}

/* 좌석은 정수 픽셀로, 반올림 뒤 남는 폭은 복도에 배분해 열 끝을 반듯하게 유지한다. */
.is-fit { --map-w:min(600px, calc(100vw - 4px)); }
.is-fit .seatmap-scroll { margin-inline:calc(var(--pad) * -1); overflow-x:visible; }
.is-fit .seatmaps { width:var(--map-w); margin-inline:auto; }
.is-fit .seatmap {
  --seat:11px;
  --seat-h:calc(var(--seat) + 1px);
  --aisle:round(down, calc((var(--map-w) - var(--map-seats) * var(--seat)) / var(--map-aisles)), 1px);
  gap:0; overflow:visible;
  align-items:center;
}
.is-fit .seat {
  --stroke:.5px;
  overflow:hidden;
  font-size:calc(var(--seat) * .66); font-weight:700;
  color:var(--ink-72);                             /* 5의 배수 방향표시 */
}
.is-fit .seat.on {                                 /* 방문 좌석 — 번호·테두리 진하게 */
  color:var(--ink);
  --stroke-l:var(--ink-55); --stroke-t:var(--ink-55); --stroke-e:var(--ink-55);
}
.is-fit .seat.on.edge-r { --stroke-r:var(--ink-55); }
.is-fit .seat.on.edge-b { --stroke-b:var(--ink-55); }
.is-fit .seat.nofill { background-color:var(--ink-14); }
.is-fit .map-hint { display:none; }
@media (max-width:600px) {
  .is-fit .seatmap {
    --seat:min(11px, round(down, calc(var(--map-w) / var(--map-cols)), 1px));
    --seat-h:calc(var(--seat) + 1px);
  }
}

/* ═══ 앉은 횟수별 색 고르기 — 팔레트와 함께 좌석배치도 위로 ═══ */
.lv-picker { margin:6px 0 12px; }
.lv-picker .held { color:var(--accent); font-weight:700; }
.lv-slots { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:200px; }
.lv-slot {
  display:flex; flex-direction:column; align-items:center; gap:5px;
  background:none; border:0; padding:4px 0; cursor:pointer;
}
.lv-slot > * { pointer-events:none; }             /* 드래그 오버 깜빡임 방지 — 이벤트는 슬롯이 받는다 */
.lv-slot .chip {                                  /* 색 칸 — 원형 */
  width:24px; height:24px; border-radius:50%;
  border:1px solid var(--ink);                    /* 색칩 테두리도 검정 — 옅게 쓰지 않는다 */
}
.lv-slot.empty .chip {                            /* 색을 안 고르면 점선 원형 빈칸 */
  border:2px dashed var(--ink-40); background:none;
}
.lv-slot:hover .chip { border-color:var(--ink); border-style:solid; }
.lv-slot.over .chip { border-color:var(--ink); border-style:solid; outline:2px solid var(--accent); outline-offset:2px; }
.lv-slot .lv { font-family:var(--mono); font-size:12px; letter-spacing:.04em; color:var(--ink-60); }

/* 팔레트 — 좌석배치도 헤더에서 장소명 옆 여백에 작게 */
.st-map-head { align-items:center; gap:6px 12px; flex-wrap:wrap; }
.st-map-head .js-map-overview { margin-left:auto; }
.palette { display:flex; flex-wrap:wrap; gap:6px; }
.palette .pal {
  width:15px; height:15px; padding:0; cursor:grab;
  border:1px solid var(--ink); border-radius:50%;
}
.palette .pal:active { cursor:grabbing; }
.palette .pal[aria-pressed="true"] { outline:2px solid var(--accent); outline-offset:2px; }

/* ═══ 칩 (배역별 고정) ═══ */
.role-row { display:flex; align-items:baseline; gap:10px; padding:5px 0; flex-wrap:wrap; }
.role-name { flex:none; width:62px; font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--ink-55); }
.chips { display:flex; flex-wrap:wrap; gap:5px; flex:1; }
.chip {
  border:1px solid var(--ink-40); background:none; color:var(--ink-60); cursor:pointer;
  font-family:var(--mono); font-size:12px; letter-spacing:.04em; padding:5px 10px;
}
.chip[aria-pressed="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }

/* ═══ 기록 줄 ═══ */
.rec-row {
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  padding:8px 0; font-size:12.5px; border-top:1px solid var(--ink-14);
}
.rec-row:first-child { border-top:0; }
.rec-row .when { font-family:var(--mono); font-size:12px; flex:none; }
.rec-row .seatinfo { font-family:var(--mono); font-size:12px; color:var(--ink-60); }
.rec-row .pair { font-weight:700; }
.rec-row .num { margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--ink-60); flex:none; }
.rec-empty { font-family:var(--mono); font-size:12px; line-height:1.7; color:var(--ink-55); padding:10px 0; }

/* 기록 한 칸 — 회차·좌석 한 줄, 그 아래 캐스팅. 삭제 모드일 때만 오른쪽 위에 ✕ */
.rec-card { position:relative; padding:9px 26px 9px 0; border-top:1px solid var(--ink-14); }
.rec-card:first-child { border-top:0; }
.rec-card .top { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.rec-card .cast {
  margin-top:3px; font-size:12px; line-height:1.55; color:var(--ink-60); text-wrap:pretty;
}
.rec-card .cast b { font-weight:700; color:var(--ink); }
.rec-x {
  position:absolute; top:6px; right:0; width:20px; height:20px; padding:0; cursor:pointer;
  border:1px solid var(--accent); background:none; color:var(--accent);
  font-family:var(--mono); font-size:12px; line-height:1;
}
.rec-x:hover { background:var(--accent); color:var(--paper); }
.head-tools { display:flex; align-items:center; gap:8px; }

.rec-add { margin-top:12px; padding-top:11px; border-top:1px solid var(--ink-28); }
.rec-add-row { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.rec-add select {
  border:1px solid var(--ink-40); background:var(--paper-3); color:var(--ink); cursor:pointer;
  font-family:var(--mono); font-size:12px; padding:7px 8px; border-radius:0;
}

.pair-fix { padding-bottom:12px; border-bottom:1px solid var(--ink-14); margin-bottom:10px; }
.pair-foot { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:9px; }

/* ═══ 저장 버튼 ═══ */
.st-save { margin-top:18px; padding-top:14px; border-top:3px double var(--ink); text-align:center; }
.st-save .np-btn { width:100%; padding:13px; font-size:12px; }
.st-save .cap { display:block; margin-top:6px; font-family:var(--mono); font-size:12px; letter-spacing:.05em; color:var(--ink-55); }

.save-preview {
  width:min(440px, calc(100vw - 28px)); max-width:none; padding:14px;
  border:1px solid var(--ink); background:var(--paper); color:var(--ink);
}
.save-preview[open] { display:grid; gap:11px; }
.save-preview::backdrop { background:rgba(23,21,15,.66); }
.save-preview img { display:block; width:100%; aspect-ratio:1586/992; object-fit:contain; background:#130c1e; }
.save-preview p { font-family:var(--body); font-size:14px; text-align:center; }
.save-preview-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

/* ═══ 로그인 게이트 ═══ */
.gate { position:relative; min-height:280px; overflow:hidden; }
.gate-locked {
  max-height:480px; overflow:hidden; contain:paint;
  filter:blur(2px); opacity:.34; pointer-events:none; user-select:none;
  transition:filter .3s ease, opacity .3s ease;
}
body.logged-in .gate { min-height:0; overflow:visible; }
body.logged-in .gate-locked {
  max-height:none; overflow:visible; contain:none;
  filter:none; opacity:1; pointer-events:auto;
}
.gate-cta {
  position:absolute; inset:0; z-index:5;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap:11px; text-align:center; padding:28px 20px 20px;
  background:linear-gradient(to bottom, rgba(233,227,213,.98) 0, rgba(233,227,213,.9) 48%, rgba(233,227,213,.18) 100%);
}
.gate-cta p { font-family:var(--mono); font-size:12px; line-height:1.8; color:var(--ink-60); max-width:34ch; }
body.logged-in .gate-cta { display:none; }

/* ═══ 등장 애니메이션 대기 ═══ */
.pre-anim .np-mast > *, .pre-anim .np-nav > *, .pre-anim .np-main > * { opacity:0; }

/* ═══ 반응형 ═══ */
@media (max-width:600px) {
  .np-mast { padding-top:56px; }
  .np-login { top:6px; min-height:44px; }
  .np-shell { --pad:14px; }
  .np-wordmark { font-size:21px; }
  .st-head { grid-template-columns:52px 1fr; gap:11px; }
  .st-poster { width:52px; height:52px; }
  .st-title { font-size:21px; }
  .role-name { width:100%; }
  .gate { min-height:250px; }
  .gate-locked { max-height:360px; filter:none; opacity:.2; }
  .gate-cta { padding:20px 10px 16px; }
}

html:has(.map-overview[open]), html:has(.save-preview[open]) { overflow:hidden; }
.map-overview {
  width:calc(100vw - 20px); height:calc(100dvh - 20px);
  max-width:none; max-height:none; padding:12px;
  border:1px solid var(--ink); background:var(--paper); color:var(--ink);
  overflow:hidden;
}
.map-overview[open] { display:grid; grid-template-rows:auto minmax(0,1fr); gap:8px; }
.map-overview::backdrop { background:rgba(23,21,15,.66); }
.map-overview-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.map-overview-head strong { font-family:var(--display); font-size:15px; }
.map-overview-tools { display:flex; align-items:center; gap:5px; }
.map-overview-zoom { min-width:38px; text-align:center; font-family:var(--mono); font-size:11px; }
.map-overview-stage {
  min-height:0; display:flex; overflow:auto;
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
}
.map-overview-content {
  flex:none; width:max-content; margin:auto; transform-origin:top left;
}
.map-overview .map-hint { display:none; }
.map-overview .is-fit { --map-w:780px; }
.map-overview .is-fit .seatmap { --seat:15px; --seat-h:15px; --aisle:10px; }
.map-overview .is-fit .seat { --stroke:1px; }
.map-overview .seatmap-scroll { margin:0; overflow:visible; }

/* Seat cells provide geometry/fill only. Borders are rendered once by seat-lines.js. */
.seat { border:0 !important; box-shadow:none !important; }
</style>

<script src="assets/common/gsap.min.js"></script>
<script src="seat-lines.js"></script>

(function () {

  if (typeof gsap === 'undefined' || reduced) return;
  document.documentElement.classList.add('pre-anim');
  setTimeout(function () { document.documentElement.classList.remove('pre-anim'); }, 1200);
})();
</script>
