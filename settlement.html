<style>
/* ═══ 좌석 배치도 ═══
   좌석번호를 그대로 grid-column으로 써서 실제 부채꼴 배열이 나온다. */
.st-floor { margin-top:14px; }
.st-floor + .st-floor { margin-top:18px; padding-top:14px; }
.st-floor-lbl {
  display:inline-block; margin-bottom:6px; padding:2px 8px;
}
.stage-bar {
  margin:2px 0 9px; padding:4px 0; text-align:center;
}
/* 배치도는 읽기 전용 — 누르는 곳이 아니므로 손가락 커서를 쓰지 않는다. */
.seatmap-scroll { position:relative; }
/* 배경을 평평한 종이색으로 깔아 좌석 사이 미세 틈으로 종이 질감이 비쳐 흔들리는 걸 막는다 */
.seatmap { position:relative; display:flex; flex-direction:column; padding-bottom:4px; }
.seatrow { display:grid; grid-template-rows:var(--seat-h, var(--seat)); height:var(--seat-h, var(--seat)); align-items:stretch; justify-items:stretch; width:max-content; gap:0; }
/* 공유 경계는 위/왼쪽만 그리고, 노출된 아래/오른쪽만 더한다. */
.seat {
  width:var(--seat); height:var(--seat-h, var(--seat));
  min-width:var(--seat); min-height:var(--seat-h, var(--seat));
  max-width:var(--seat); max-height:var(--seat-h, var(--seat));
  border:0; box-sizing:border-box;
  --stroke:1px;
  --stroke-r:transparent; --stroke-b:transparent;
  border-style:solid;
  border-width:var(--stroke);
  border-color:var(--stroke-t) var(--stroke-r) var(--stroke-b) var(--stroke-l);
  cursor:default;
  display:grid; place-items:center; grid-row:1; align-self:stretch; justify-self:stretch; line-height:1; padding:0;
}
.seat.edge-r { --stroke-r:var(--stroke-e); }
.seat.edge-b { --stroke-b:var(--stroke-e); }


.rl { font-size:calc(var(--seat) * .6); line-height:1; text-align:center; white-space:nowrap; align-self:center; grid-row:1;
}

/* 좌석은 정수 픽셀로, 반올림 뒤 남는 폭은 복도에 배분해 열 끝을 반듯하게 유지한다. */
.is-fit { --map-w:min(600px, calc(100vw - 4px)); }
.is-fit .seatmap-scroll { margin-inline:calc(var(--pad) * -1); overflow-x:visible; }
.is-fit .seatmaps { width:var(--map-w); margin-inline:auto; }
.is-fit .seatmap {
  --seat:11px;
  --seat-h:calc(var(--seat) + 1px);
  --aisle:round(down, calc((var(--map-w) - var(--map-seats) * var(--seat)) / var(--map-aisles)), 1px);
  gap:0; overflow:visible;
  align-items:center;
}
.is-fit .seat {
  --stroke:.5px;
  overflow:hidden;
  font-size:calc(var(--seat) * .66);                             /* 5의 배수 방향표시 */
}
.is-fit .seat.on {                                 /* 방문 좌석 — 번호·테두리 진하게 */
}



.is-fit .map-hint { display:none; }
@media (max-width:600px) {
  .is-fit .seatmap {
    --seat:min(11px, round(down, calc(var(--map-w) / var(--map-cols)), 1px));
    --seat-h:calc(var(--seat) + 1px);
  }
}

/* ═══ 반응형 ═══ */
@media (max-width:600px) {
  .np-mast { padding-top:56px; }
  .np-login { top:6px; min-height:44px; }
  .np-shell { --pad:14px; }

  .st-head { grid-template-columns:52px 1fr; gap:11px; }
  .st-poster { width:52px; height:52px; }

  .role-name { width:100%; }
  .gate { min-height:250px; }

  .gate-cta { padding:20px 10px 16px; }
}

html:has(.map-overview[open]), html:has(.save-preview[open]) { overflow:hidden; }
.map-overview {
  width:calc(100vw - 20px); height:calc(100dvh - 20px);
  max-width:none; max-height:none; padding:12px;
  overflow:hidden;
}
.map-overview[open] { display:grid; grid-template-rows:auto minmax(0,1fr); gap:8px; }

.map-overview-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }

.map-overview-tools { display:flex; align-items:center; gap:5px; }
.map-overview-zoom { min-width:38px; text-align:center; }
.map-overview-stage {
  min-height:0; display:flex; overflow:auto;
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
}
.map-overview-content {
  flex:none; width:max-content; margin:auto; transform-origin:top left;
}
.map-overview .map-hint { display:none; }
.map-overview .is-fit { --map-w:780px; }
.map-overview .is-fit .seatmap { --seat:15px; --seat-h:15px; --aisle:10px; }
.map-overview .is-fit .seat { --stroke:1px; }
.map-overview .seatmap-scroll { margin:0; overflow:visible; }

/* Seat cells provide geometry/fill only. Borders are rendered once by seat-lines.js. */
.seat { border:0 !important; box-shadow:none !important; }
</style>
