<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애배력 — 강홍석 스케줄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   애배력 — 스케줄 탭 (PRD_v3 3장)

   디자인: Claude Design 〈Fan Schedule Newspaper〉 — 신문 지면 미감.
   달력형이 이 탭의 중심 화면이고, 목록형은 같은 미감의 지면 기사 열로 둔다
   ("내 달력" 별도 탭 없음 — 관극 여부는 여기서 체크). 회차 클릭 시 하단 시트
   상세: 배역·상대역, 이벤트, (로그인 시) 관극 체크 + 좌석.
   정산판(settlement.html)은 이번 작업에서 손대지 않음.
   ═══════════════════════════════════════════════════════════ */

:root {
  --paper:#e9e3d5; --paper-2:#e3dccb; --paper-3:#ded7c6;
  --ink:#17150f;
  --ink-72:rgba(23,21,15,.72); --ink-60:rgba(23,21,15,.6);
  --ink-55:rgba(23,21,15,.55); --ink-45:rgba(23,21,15,.45);
  --ink-40:rgba(23,21,15,.4);  --ink-28:rgba(23,21,15,.28);
  --ink-14:rgba(23,21,15,.14);
  --accent:#8f2e22;

  --fraktur:"UnifrakturMaguntia","Playfair Display","Noto Serif KR",serif;
  --display:"Playfair Display","Noto Serif KR",serif;
  --serif:"Noto Serif KR",serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.5), rgba(0,0,0,0) 55%),
    radial-gradient(100% 50% at 50% 100%, rgba(90,78,55,.14), rgba(0,0,0,0) 70%);
  background-attachment:fixed;
}
[hidden] { display:none !important; }
.mono { font-family:var(--mono); }
a { color:var(--accent); text-decoration:none; }

.np-shell {
  max-width:600px; margin:0 auto; min-height:100vh;
  padding:0 18px; display:flex; flex-direction:column;
  background:rgba(233,227,213,.55);
}
@media (min-width:640px) { .np-shell { border-inline:1px solid var(--ink-14); } }

/* ═══ 마스트헤드 ═══ */
.np-mast { position:relative; flex:none; padding:18px 0 10px; text-align:center; border-bottom:3px double var(--ink); }
.np-login {
  position:absolute; right:0; top:14px;
  border:1px solid var(--ink-40); background:none; color:var(--ink);
  font-family:var(--mono); font-size:9px; letter-spacing:.12em;
  padding:4px 8px; cursor:pointer;
}
.np-login:hover { background:var(--ink); color:var(--paper); }
.np-wordmark { font-family:var(--fraktur); font-weight:400; font-size:31px; line-height:1; letter-spacing:.01em; margin:2px 0 4px; }
.np-byline {
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  padding-top:6px; border-top:1px solid var(--ink-40);
  font-family:var(--mono); font-size:9px; letter-spacing:.08em; color:var(--ink-60);
}
.np-byline > :first-child { text-align:left; }
.np-byline > :last-child { text-align:right; }
.np-byline .by-name { text-align:center; color:#6B3FA0; font-weight:500; }

/* ═══ 탭 ═══ */
.np-nav {
  flex:none; display:flex; gap:18px; justify-content:center;
  padding:9px 0; border-bottom:1px solid var(--ink-28);
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
}
.np-nav [aria-current] { color:var(--ink); border-bottom:2px solid var(--accent); padding-bottom:3px; }
.np-nav a { color:var(--ink-55); }
.np-nav a:hover { color:var(--ink); }

.np-main { flex:1; padding:14px 0 28px; }

.np-foot { flex:none; border-top:3px double var(--ink); padding:12px 0 26px; }
.np-foot p { font-family:var(--mono); font-size:8.5px; line-height:1.7; letter-spacing:.03em; color:var(--ink-55); }

/* ═══ 뷰 토글 ═══ */
.np-vt { display:flex; width:max-content; margin:0 auto 4px; border:1px solid var(--ink-40); }
.np-vt button {
  border:0; background:none; color:var(--ink-55); cursor:pointer;
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; padding:6px 16px;
}
.np-vt button + button { border-left:1px solid var(--ink-40); }
.np-vt button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }

/* ═══ 다가오는 회차 (지면 헤드라인) ═══ */
.np-lead { padding:14px 0 13px; border-bottom:1px solid var(--ink-28); }
.np-lead-kick { font-family:var(--mono); font-size:8.5px; letter-spacing:.2em; color:var(--accent); text-transform:uppercase; }
.np-lead-ttl { font-family:var(--display); font-weight:900; font-size:22px; line-height:1.14; letter-spacing:-.01em; margin:4px 0 5px; }
.np-lead-deck { font-size:12px; line-height:1.62; color:var(--ink-72); text-wrap:pretty; }
.np-lead-meta { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; font-family:var(--mono); font-size:9px; letter-spacing:.05em; color:var(--ink-60); }
.np-lead-meta .dday { background:var(--ink); color:var(--paper); padding:2px 6px; white-space:nowrap; }

/* ═══ 달 이동 ═══ */
.np-month { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 0 0; }
.np-month button {
  flex:none; width:26px; height:26px; border:1px solid var(--ink-40);
  background:none; color:var(--ink); font-family:var(--mono); font-size:12px; cursor:pointer;
}
.np-month button:disabled { opacity:.3; cursor:not-allowed; }
.np-month .m-mid { text-align:center; flex:1; }
.np-month .m-ttl { font-family:var(--display); font-weight:700; font-style:italic; font-size:19px; line-height:1; }
.np-month .m-sub { font-family:var(--mono); font-size:8.5px; letter-spacing:.18em; color:var(--ink-55); margin-top:2px; text-transform:uppercase; }

/* ═══ 달력 격자 ═══ */
.np-cal { margin-top:10px; border-top:2px solid var(--ink); border-bottom:1px solid var(--ink-28); }
.np-dow { display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--ink-28); }
.np-dow div { text-align:center; padding:5px 0; font-family:var(--mono); font-size:9px; letter-spacing:.06em; color:var(--ink-60); }
.np-dow .sun { color:var(--accent); }
.np-grid { display:grid; grid-template-columns:repeat(7,1fr); }
.np-cell {
  min-height:82px; padding:6px 2px 6px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  border-right:1px solid var(--ink-14); border-bottom:1px solid var(--ink-14);
}
.np-cell:nth-child(7n) { border-right:0; }
.np-grid .np-cell:nth-last-child(-n+7) { border-bottom:0; }
.np-cell.pad { opacity:.3; }
.np-cell[data-day] { cursor:pointer; }
.np-cell .n { font-family:var(--display); font-size:13px; font-weight:600; line-height:1; color:var(--ink); }
.np-cell.sun .n { color:rgba(143,46,34,.8); }
.np-cell.today .n { color:var(--accent); font-weight:900; border-bottom:2px solid var(--accent); }
.np-cell.sel { background:var(--ink); }
.np-cell.sel .n, .np-cell.sel .np-cell-t { color:var(--paper); }
.np-cell-photo {
  width:38px; height:38px; border-radius:50%; object-fit:cover; object-position:50% 22%;
  filter:grayscale(1) contrast(1.12); border:1px solid var(--ink-28); background:var(--paper-3);
}
.np-cell.sel .np-cell-photo { border-color:var(--paper); }
.np-cell-t { font-family:var(--mono); font-size:8px; letter-spacing:.01em; color:var(--ink-72); line-height:1.2; }

/* ═══ 지면 섹션 (선택한 날 / 목록) ═══ */
.np-sec { margin-top:14px; border-top:3px double var(--ink); padding-top:11px; }
.np-sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.np-sec-head h3 { font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.01em; }
.np-sec-head .cnt { font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--ink-55); }
.np-sec-body { margin-top:8px; }

.np-entry {
  display:grid; grid-template-columns:56px 1fr; gap:11px;
  width:100%; text-align:left; background:none; border:0;
  border-top:1px solid var(--ink-14); padding:11px 0;
  font-family:var(--serif); cursor:pointer;
}
.np-entry:first-of-type { border-top:0; }
.np-entry:active { opacity:.55; }
.np-entry .lc { text-align:right; border-right:1px solid var(--ink-14); padding-right:9px; }
.np-entry .lc .big { font-family:var(--mono); font-size:13px; font-weight:500; letter-spacing:-.01em; }
.np-entry .lc .sm { font-family:var(--mono); font-size:8px; letter-spacing:.08em; color:var(--ink-55); margin-top:2px; }
.np-entry.daycol .lc .big { font-family:var(--display); font-size:17px; font-weight:600; }
.np-entry .tags { display:flex; flex-wrap:wrap; align-items:center; gap:5px 6px; }
.np-entry .cat { font-family:var(--mono); font-size:8.5px; letter-spacing:.14em; color:var(--ink-55); font-style:normal; text-transform:uppercase; }
.np-entry.went .cat { color:var(--accent); }
.np-entry .ttl { display:block; font-weight:700; font-size:14px; line-height:1.35; letter-spacing:-.01em; margin:3px 0; }
.np-entry .place { display:block; font-size:11px; color:var(--ink-60); }
.np-entry.past { opacity:.5; }
.np-mini {
  font-family:var(--mono); font-size:8px; letter-spacing:.04em; font-style:normal;
  border:1px solid var(--ink-28); padding:1px 5px; color:var(--ink-60);
}
.np-mini.unv, .np-mini.hist { color:var(--accent); border-color:rgba(143,46,34,.4); }
.np-mini.went { background:var(--ink); color:var(--paper); border-color:var(--ink); }

.np-empty { border-top:1px solid var(--ink-14); padding:24px 0; text-align:center; }
.np-empty .h { font-family:var(--display); font-style:italic; font-size:15px; color:var(--ink-55); }
.np-empty .s { font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; color:var(--ink-40); margin-top:5px; }

.np-past {
  display:block; width:100%; padding:11px; margin-top:2px;
  background:none; border:0; border-top:1px solid var(--ink-28);
  font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--ink-55); cursor:pointer;
}
.np-past:hover { color:var(--ink); }

/* ═══ 예매 버튼 ═══ */
.np-book {
  margin-top:16px; border-top:1px solid var(--ink-28); border-bottom:1px solid var(--ink-28);
  padding:12px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.np-book-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:12px 8px; border:1px solid var(--ink); background:var(--paper);
  text-decoration:none; color:var(--ink);
}
.np-book-btn:hover { background:var(--ink); color:var(--paper); }
.np-book-btn .lbl { font-family:var(--mono); font-size:8px; letter-spacing:.2em; color:var(--ink-55); text-transform:uppercase; }
.np-book-btn:hover .lbl { color:var(--paper); }
.np-book-btn b { font-family:var(--display); font-weight:700; font-size:16px; }

.np-listhead { display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:4px 0 2px; }
.np-listhead h3 { font-family:var(--display); font-weight:700; font-size:15px; }
.np-listhead .cnt { font-family:var(--mono); font-size:9px; letter-spacing:.08em; color:var(--ink-55); }

/* ═══ 회차 상세 (하단 시트) ═══ */
.np-sheet-wrap { position:fixed; inset:0; z-index:40; }
.np-sheet-back { position:absolute; inset:0; background:rgba(15,14,10,.55); }
.np-sheet {
  position:absolute; left:0; right:0; bottom:0; max-width:600px; margin:0 auto;
  background:var(--paper); border-top:3px double var(--ink);
  padding:14px 20px 22px; max-height:84vh; overflow-y:auto;
}
.np-sheet-head { display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:8.5px; letter-spacing:.16em; color:var(--ink-55); text-transform:uppercase; }
.np-x { border:0; background:none; font-family:var(--mono); font-size:13px; cursor:pointer; color:var(--ink); }
.np-sheet-ttl { font-family:var(--display); font-weight:900; font-size:22px; line-height:1.16; letter-spacing:-.01em; margin:7px 0 2px; }
.np-sheet-sub { font-family:var(--mono); font-size:9px; letter-spacing:.06em; color:var(--ink-60); }
.np-hr { height:1px; background:var(--ink-28); margin:10px 0; }
.np-cast { width:100%; border-collapse:collapse; font-size:13px; }
.np-cast th, .np-cast td { text-align:left; padding:7px 0; border-bottom:1px solid var(--ink-14); }
.np-cast th { width:82px; font-weight:400; color:var(--ink-55); font-family:var(--mono); font-size:10px; letter-spacing:.08em; }
.np-cast .you { font-weight:700; }
.np-cast .you::after {
  content:"강홍석"; margin-left:6px;
  font-family:var(--mono); font-size:8px; font-weight:500; letter-spacing:.04em;
  color:var(--paper); background:var(--ink); padding:1px 5px;
}
.np-badges { display:flex; flex-wrap:wrap; gap:5px; margin-top:12px; }
.np-badge { font-family:var(--mono); font-size:8.5px; letter-spacing:.05em; border:1px solid var(--ink-28); padding:2px 6px; color:var(--ink-60); }
.np-badge.unv { color:var(--accent); border-color:rgba(143,46,34,.4); }
.np-noev { margin-top:12px; font-family:var(--mono); font-size:9px; letter-spacing:.06em; color:var(--ink-40); }
.np-hist { margin-top:12px; padding:10px 12px; background:var(--paper-3); border-left:3px solid var(--accent); font-size:11.5px; line-height:1.5; }
.np-hist b { display:block; margin-bottom:3px; color:var(--accent); font-family:var(--mono); font-size:9px; letter-spacing:.08em; }
.np-hist span { display:block; margin-top:3px; font-family:var(--mono); font-size:8px; color:var(--ink-55); }
.np-check { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; }
.np-check .hint { font-family:var(--mono); font-size:8px; letter-spacing:.04em; color:var(--ink-45); }
.np-btn {
  border:1px solid var(--ink); background:none; color:var(--ink); cursor:pointer;
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; padding:10px 14px;
}
.np-btn.solid { background:var(--ink); color:var(--paper); }
.np-btn.ghost { border-color:var(--ink-40); }
.np-btn:disabled { opacity:.4; cursor:not-allowed; }
.np-sheet-foot { margin-top:12px; text-align:center; font-family:var(--mono); font-size:8px; letter-spacing:.06em; color:var(--ink-40); }

/* ═══ 좌석 선택 모달 ═══ */
.modal-backdrop { position:fixed; inset:0; z-index:50; background:rgba(15,14,10,.55); display:flex; align-items:center; justify-content:center; padding:20px; }
.modal { background:var(--paper); border:1px solid var(--ink); max-width:400px; width:100%; max-height:86vh; overflow:auto; padding:20px; }
.modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.modal-head h3 { font-family:var(--display); font-weight:700; font-size:16px; }
.modal-head .sub { font-family:var(--mono); font-size:8.5px; letter-spacing:.04em; color:var(--ink-55); margin-top:3px; }
.modal-close { border:0; background:none; cursor:pointer; color:var(--ink); font-family:var(--mono); font-size:14px; }
.modal .field-lbl { font-family:var(--mono); font-size:8.5px; letter-spacing:.06em; color:var(--ink-55); margin:14px 0 8px; line-height:1.6; }
.seatgrid { display:flex; flex-direction:column; gap:4px; overflow-x:auto; }
.seatgrid .row { display:flex; gap:4px; align-items:center; }
.seatgrid .rowlabel { width:16px; font-family:var(--mono); font-size:9px; color:var(--ink-40); text-align:center; }
.seat { width:26px; height:26px; border:1px solid var(--ink-28); background:var(--paper-3); cursor:pointer; padding:0; }
.seat:hover { border-color:var(--ink); }
.seat.mine { background:var(--ink); border-color:var(--ink); }

/* ═══ 등장 애니메이션 대기 ═══ */
.pre-anim .np-mast > *, .pre-anim .np-nav > *, .pre-anim .np-main > * { opacity:0; }

/* ═══ 반응형 ═══ */
@media (max-width:600px) {
  .np-shell { padding:0 14px; }
  .np-wordmark { font-size:23px; }
  .np-cell { min-height:68px; }
  .np-cell-photo { width:30px; height:30px; }
  .np-entry { grid-template-columns:48px 1fr; gap:9px; }
}
</style>

<!-- 등장 애니메이션이 깜빡이지 않도록 본문보다 먼저 GSAP을 받아 둔다. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>
(function () {
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (typeof gsap === 'undefined' || reduced) return;
  document.documentElement.classList.add('pre-anim');
  setTimeout(function () { document.documentElement.classList.remove('pre-anim'); }, 1200);
})();
</script>
</head>
<body>

<div class="np-shell">
  <header class="np-mast" id="mast">
    <button class="np-login" id="loginBtn">로그인</button>
    <h1 class="np-wordmark">Neue Fan Zeitung</h1>
    <div class="np-byline"><span id="todayStamp"></span><span class="by-name">강홍석</span><span>NO. 1</span></div>
  </header>

  <nav class="np-nav" aria-label="주 메뉴">
    <span aria-current="page">스케줄</span>
    <a href="settlement.html">정산판</a>
  </nav>

  <main class="np-main" id="wrap"></main>

  <footer class="np-foot">
    <p>© <span class="mono">2026</span> 애배력 — 회차별 캐스팅과 이벤트 정보는 제작사 공식 공지를 1차 출처로 합니다.
       현재 표시되는 일정·캐스팅은 준비 중인 예시 데이터입니다.</p>
  </footer>
</div>

<!-- 회차 상세 — #wrap 재렌더와 무관하게 열림 상태를 유지하려 별도 정적 노드로 둔다 -->
<div class="np-sheet-wrap" id="sheet" hidden>
  <div class="np-sheet-back" id="sheetBack"></div>
  <div class="np-sheet" role="dialog" aria-modal="true" aria-label="회차 상세" id="sheetBody"></div>
</div>

<!-- 좌석 선택 모달 -->
<div class="modal-backdrop" id="seatModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="seatModalTitle">
    <div class="modal-head">
      <div>
        <h3 id="seatModalTitle">좌석 선택</h3>
        <p class="sub" id="seatModalSub"></p>
      </div>
      <button type="button" class="modal-close" id="seatModalClose" aria-label="닫기">✕</button>
    </div>
    <p class="field-lbl">앉았던 좌석을 골라주세요 — 대표 좌석 그리드입니다. 실제 배치도는 작품마다 별도 준비됩니다.</p>
    <div id="seatModalGrid"></div>
  </div>
</div>

<!-- 공용 데이터 · 헬퍼 (정산판 탭과 공유) -->
<script src="data.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   모션 — GSAP 3.15 (settlement.html과 같은 값)
   ═══════════════════════════════════════════════════════════ */
const $$ = s => document.querySelectorAll(s);
const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
const MOTION = typeof gsap !== 'undefined' && !mq('(prefers-reduced-motion: reduce)');

if (!MOTION) console.warn('[애배력] 모션 꺼짐 — ' + (typeof gsap === 'undefined'
  ? 'GSAP을 불러오지 못했습니다 (CDN 차단 · 오프라인)'
  : '브라우저가 prefers-reduced-motion: reduce 를 요청했습니다'));

const EASE = { out:'expo.out', in:'power2.out', pop:'back.out(1.5)' };
if (MOTION) gsap.defaults({ ease:EASE.out, duration:.36 });

const MONTH_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['일','월','화','수','목','금','토'];
const dowShort = p => WD[new Date(p.y, p.m - 1, p.d).getDay()];

/* ═══════════════════════════════════════════════════════════
   상태
   ═══════════════════════════════════════════════════════════ */
let view = 'calendar';                 // 'calendar' | 'list' — 달력형이 이 탭의 중심
let ym = { y:TODAY.y, m:TODAY.m };      // 달력형에서 보고 있는 달
let selDay = 1;                         // 달력형에서 선택된 날 (지면 섹션 대상)
let showPast = false;                   // 목록형에서 지난 회차 펼침 여부
let sheetKey = null;                    // 열린 상세 시트의 perfKey
let loggedIn = false;
let skipAnim = false;
let gridFrom = 'start';

const inMonth = p => p.y === ym.y && p.m === ym.m;
const monthPerfs = () => hongPerfs().filter(inMonth).sort(cmpPerf);

/* 달력 셀 안에 넣는 배우 사진 (강홍석 · 엘리자벳 프로모션).
   TODO: 관리자 업로드 사진으로 교체 (PRD_v3 3.1 / 3.2) — 그때 이 경로만 바꾸면 된다. */
const PHOTO = 'ref/news.jpg';

function defaultSelDay () {
  const days = [...new Set(monthPerfs().map(p => p.d))].sort((a, b) => a - b);
  if (!days.length) return 1;
  if (ym.y === TODAY.y && ym.m === TODAY.m) return days.find(d => d >= TODAY.d) || days[days.length - 1];
  return days[0];
}

/* ═══════════════════════════════════════════════════════════
   렌더
   ═══════════════════════════════════════════════════════════ */
function render () {
  document.body.classList.toggle('logged-in', loggedIn);
  $('#loginBtn').textContent = loggedIn ? '로그아웃' : '로그인';
  $('#wrap').innerHTML = viewTabsHTML() + (view === 'calendar' ? calendarHTML() : listHTML());
  bind();
  animateBody();
}

function viewTabsHTML () {
  return `<div class="np-vt" role="tablist" aria-label="보기 전환">
    <button type="button" role="tab" data-view="calendar" aria-pressed="${view === 'calendar'}">달력</button>
    <button type="button" role="tab" data-view="list" aria-pressed="${view === 'list'}">목록</button>
  </div>`;
}

/* ── 다가오는 회차 (지면 헤드라인) ── */
function leadHTML () {
  const up = hongPerfs().filter(p => !isPast(p)).sort(cmpPerf);
  const p = up[0] || hongPerfs().sort(cmpPerf).slice(-1)[0];
  if (!p) return '';
  const diff = Math.round((new Date(p.y, p.m - 1, p.d) - new Date(TODAY.y, TODAY.m - 1, TODAY.d)) / 86400000);
  const dday = diff === 0 ? 'D-DAY' : diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff);
  const role = (hongRole(p) || {}).name || '';

  let deck;
  if ((p.events || []).length) deck = `${p.events.map(e => e.label).join(' · ')} 등 회차 이벤트가 예정돼 있습니다.`;
  else if (p.history) deck = `직전 캐스팅 변경이 반영된 회차입니다.`;
  else deck = `${ACTORS[HONG].name} 출연 예정 회차입니다. 새 캐스팅·이벤트가 공개되면 이 자리에 먼저 실립니다.`;

  return `<section class="np-lead">
    <div class="np-lead-kick">다가오는 회차</div>
    <h2 class="np-lead-ttl">뮤지컬 &lsquo;${WORK.title}&rsquo;${role ? ` ${role} 역` : ''}</h2>
    <p class="np-lead-deck">${deck}</p>
    <div class="np-lead-meta">
      <span class="dday">${dday}</span>
      <span>${p.m}월 ${p.d}일 ${dowShort(p)} · ${p.t}${WORK.venue ? ' · ' + WORK.venue : ''}</span>
    </div>
  </section>`;
}

/* ── 지면 기사 한 줄 (달력 지면 / 목록 공용) ── */
function entryHTML (p, mode, extra) {
  const key = perfKey(p);
  const role = (hongRole(p) || {}).name || '';
  const went = loggedIn && !!recordFor(p);
  const daycol = mode === 'day';

  const badges = [
    ...(p.events || []).map(e => `<em class="np-mini${e.verified ? '' : ' unv'}">${e.label}${e.verified ? '' : ' · 미검증'}</em>`),
    p.history ? `<em class="np-mini hist">캐스팅 변경</em>` : '',
    went ? `<em class="np-mini went">✓ 봤어요</em>` : ''
  ].filter(Boolean).join('');

  const lc = daycol
    ? `<div class="lc"><div class="big">${p.d}</div><div class="sm">${p.m}월 ${dowShort(p)}</div></div>`
    : `<div class="lc"><div class="big">${p.t}</div><div class="sm">${dowShort(p)}요일</div></div>`;

  return `<button type="button" class="np-entry${daycol ? ' daycol' : ''}${went ? ' went' : ''}${extra ? ' ' + extra : ''}" data-key="${key}">
    ${lc}
    <div>
      <div class="tags"><em class="cat">뮤지컬 회차</em>${badges}</div>
      <span class="ttl">${WORK.title}${role ? ` — ${role} 역` : ''}</span>
      <span class="place">${WORK.venue || '극장 미정 · 공식 공지 예정'}</span>
    </div>
  </button>`;
}

/* ═══ 달력형 ═══ */
function calendarHTML () {
  const list = monthPerfs();
  const byDay = {};
  list.forEach(p => (byDay[p.d] = byDay[p.d] || []).push(p));

  const first = firstDow(ym.y, ym.m);
  const dim = daysIn(ym.y, ym.m);
  const totalCells = Math.ceil((first + dim) / 7) * 7;

  let cells = '';
  for (let i = 0; i < totalCells; i++) {
    const day = i - first + 1;
    if (day < 1 || day > dim) { cells += `<div class="np-cell pad"></div>`; continue; }
    const dItems = (byDay[day] || []).sort((a, b) => a.t.localeCompare(b.t));
    const isSel = day === selDay;
    const isToday = ym.y === TODAY.y && ym.m === TODAY.m && day === TODAY.d;
    const isSun = (i % 7) === 0;
    const cls = ['np-cell', isSel ? 'sel' : '', isToday ? 'today' : '', isSun ? 'sun' : ''].join(' ').trim();
    const inner = dItems.length
      ? `<img class="np-cell-photo" src="${PHOTO}" alt="${ACTORS[HONG].name}" loading="lazy">
         <span class="np-cell-t">${dItems.map(p => p.t).join('·')}</span>`
      : '';
    cells += `<div class="${cls}" data-day="${day}">
      <span class="n">${day}</span>
      ${inner}
    </div>`;
  }

  const dow = WD.map((w, i) => `<div class="${i === 0 ? 'sun' : ''}">${w}</div>`).join('');

  const dayList = (byDay[selDay] || []).sort((a, b) => a.t.localeCompare(b.t));
  const entries = dayList.length
    ? dayList.map(p => entryHTML(p, 'time')).join('')
    : `<div class="np-empty"><div class="h">No entries filed.</div><div class="s">이 날은 ${ACTORS[HONG].name} 공연이 없습니다</div></div>`;

  return `
  ${leadHTML()}
  <section>
    <div class="np-month">
      <button type="button" class="js-month" data-step="-1" aria-label="이전 달" ${idx(ym) > idx(RANGE.min) ? '' : 'disabled'}>‹</button>
      <div class="m-mid">
        <div class="m-ttl">${MONTH_EN[ym.m - 1]} ${ym.y}</div>
        <div class="m-sub">${ym.y}년 ${ym.m}월 · ${ACTORS[HONG].name} ${list.length}회차</div>
      </div>
      <button type="button" class="js-month" data-step="1" aria-label="다음 달" ${idx(ym) < idx(RANGE.max) ? '' : 'disabled'}>›</button>
    </div>
    <div class="np-cal">
      <div class="np-dow">${dow}</div>
      <div class="np-grid">${cells}</div>
    </div>
  </section>

  <section class="np-sec">
    <div class="np-sec-head">
      <h3>${ym.m}월 ${selDay}일의 지면</h3>
      <span class="cnt">${dayList.length} ENTRIES</span>
    </div>
    <div class="np-sec-body">${entries}</div>
  </section>

  <section class="np-book">
    <a class="np-book-btn" href="https://ticket.melon.com/performance/index.htm?prodId=213480" target="_blank" rel="noopener">
      <span class="lbl">엘리자벳 예매</span><b>멜론티켓</b>
    </a>
    <a class="np-book-btn" href="https://tickets.interpark.com/goods/26009314" target="_blank" rel="noopener">
      <span class="lbl">엘리자벳 예매</span><b>NOL 티켓</b>
    </a>
  </section>`;
}

/* ═══ 목록형 ═══ */
function listHTML () {
  const all = hongPerfs().sort(cmpPerf);
  const upcoming = all.filter(p => !isPast(p));
  const past = all.filter(isPast);

  const rows = upcoming.length
    ? upcoming.map(p => entryHTML(p, 'day')).join('')
    : `<div class="np-empty"><div class="h">No upcoming entries.</div><div class="s">새 캐스팅표가 공개되면 반영됩니다</div></div>`;

  const pastBlock = past.length
    ? `<button type="button" class="np-past" id="pastToggle">${showPast ? '▲ 지난 회차 접기' : `▼ 지난 회차 ${past.length}건`}</button>` +
      (showPast ? past.map(p => entryHTML(p, 'day', 'past')).join('') : '')
    : '';

  return `<section>
    <div class="np-listhead">
      <h3>${ACTORS[HONG].name} 출연 회차</h3>
      <span class="cnt">예정 ${upcoming.length} · 지난 ${past.length}</span>
    </div>
    <div class="np-sec-body">${rows}${pastBlock}</div>
  </section>`;
}

/* ═══════════════════════════════════════════════════════════
   회차 상세 (하단 시트)
   ═══════════════════════════════════════════════════════════ */
function sheetHTML (p) {
  const diff = Math.round((new Date(p.y, p.m - 1, p.d) - new Date(TODAY.y, TODAY.m - 1, TODAY.d)) / 86400000);
  const dday = diff === 0 ? 'D-DAY' : diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff);

  const rows = ROLES.map(r => {
    const a = p.cast[r.id];
    if (!a) return '';
    return `<tr><th>${r.name}</th><td class="${a === HONG ? 'you' : ''}">${actorName(a)}</td></tr>`;
  }).join('');

  const events = p.events || [];
  const evHTML = events.length
    ? `<div class="np-badges">${events.map(e => `<span class="np-badge${e.verified ? '' : ' unv'}">${e.label}${e.verified ? '' : ' · 미검증'}</span>`).join('')}</div>`
    : `<p class="np-noev">이벤트 정보 없음 · 제보는 추후 지원</p>`;

  const hist = p.history
    ? `<div class="np-hist"><b>캐스팅 변경</b>${p.history.role} 역 ${p.history.from} → ${p.history.to}
        <span>${p.history.when} 반영 · 예정 캐스팅은 이력에 보관됩니다</span></div>`
    : '';

  const rec = recordFor(p);
  const check = loggedIn
    ? `<div class="np-check">
        <button type="button" class="np-btn ${rec ? 'solid' : ''} js-check" aria-pressed="${!!rec}">${rec ? '✓ 이 회차 봤어요' : '이 회차 봤어요'}</button>
        ${rec
          ? `<button type="button" class="np-btn ghost js-seat">${rec.seat ? `좌석 ${rec.seat} · 변경` : '좌석 선택'}</button>`
          : `<span class="hint">눌러서 관극 기록을 남기세요</span>`}
      </div>`
    : `<div class="np-check">
        <button type="button" class="np-btn ghost" disabled>이 회차 봤어요</button>
        <span class="hint">로그인하면 관극 기록과 좌석을 남길 수 있습니다</span>
      </div>`;

  return `
    <div class="np-sheet-head">
      <span>회차 · ${p.m}월 ${p.d}일 ${dowShort(p)}요일</span>
      <button type="button" class="np-x js-close" aria-label="닫기">✕</button>
    </div>
    <h3 class="np-sheet-ttl">${WORK.title}</h3>
    <p class="np-sheet-sub">${p.t} 시작${WORK.venue ? ' · ' + WORK.venue : ''}</p>
    <div class="np-hr"></div>
    <table class="np-cast"><tbody>${rows}</tbody></table>
    ${evHTML}${hist}${check}
    <p class="np-sheet-foot">${dday} · 티켓/방청 정보는 공식 채널을 확인하세요</p>`;
}

function openSheet (p) {
  sheetKey = perfKey(p);
  const wrap = $('#sheet');
  const body = $('#sheetBody');
  body.innerHTML = sheetHTML(p);
  wrap.hidden = false;

  body.querySelector('.js-close').addEventListener('click', closeSheet);
  const c = body.querySelector('.js-check');
  if (c) c.addEventListener('click', () => {
    toggleCheck(p);
    const np = perfFromKey(sheetKey);
    if (np) openSheet(np);          // 시트 안 체크 상태 갱신
  });
  const s = body.querySelector('.js-seat');
  if (s) s.addEventListener('click', () => openSeatModal(p));

  document.removeEventListener('keydown', escCloseSheet);
  document.addEventListener('keydown', escCloseSheet);

  if (!MOTION) return;
  gsap.fromTo('#sheetBack', { opacity:0 }, { opacity:1, duration:.18, ease:EASE.out });
  gsap.fromTo('#sheetBody', { yPercent:100 }, { yPercent:0, duration:.34, ease:EASE.out });
}

function closeSheet () {
  const wrap = $('#sheet');
  if (wrap.hidden) return;
  document.removeEventListener('keydown', escCloseSheet);
  sheetKey = null;
  const done = () => { wrap.hidden = true; };
  if (!MOTION) return done();
  gsap.to('#sheetBack', { opacity:0, duration:.16 });
  gsap.to('#sheetBody', { yPercent:100, duration:.24, ease:EASE.in, onComplete:done });
}
function escCloseSheet (e) { if (e.key === 'Escape') closeSheet(); }

/* ═══ 관극 기록 (my_records 목업) ═══ */
function toggleCheck (p) {
  const key = perfKey(p);
  const existing = MY_RECORDS.find(r => r.key === key);
  if (existing) MY_RECORDS = MY_RECORDS.filter(r => r.key !== key);
  else MY_RECORDS.push({ key, seat:null });
  skipAnim = true;
  render();
}

function setSeatForPerf (p, seatId) {
  const rec = MY_RECORDS.find(r => r.key === perfKey(p));
  if (!rec) return;
  rec.seat = seatId;
  skipAnim = true;
  render();
}

/* ═══ 좌석 선택 모달 ═══ */
function seatModalGridHTML (perf) {
  const mySeat = (recordFor(perf) || {}).seat;
  const rows = SEAT_ROWS.map(r => {
    let cells = '';
    for (let c = 1; c <= SEAT_COLS; c++) {
      const id = `${r}-${c}`;
      cells += `<button type="button" class="seat${id === mySeat ? ' mine' : ''}" data-seat="${id}" aria-label="${r}열 ${c}번" title="${r}열 ${c}번"></button>`;
    }
    return `<div class="row"><span class="rowlabel">${r}</span>${cells}</div>`;
  }).join('');
  return `<div class="seatgrid">${rows}</div>`;
}

function openSeatModal (perf) {
  const modal = $('#seatModal');
  $('#seatModalSub').textContent = `${WORK.title} · ${perf.m}월 ${perf.d}일 ${perf.t}`;
  $('#seatModalGrid').innerHTML = seatModalGridHTML(perf);
  $('#seatModalGrid').querySelectorAll('.seat').forEach(seat => {
    seat.addEventListener('click', () => {
      setSeatForPerf(perf, seat.dataset.seat);
      closeSeatModal();
      if (sheetKey) { const np = perfFromKey(sheetKey); if (np) openSheet(np); }
    });
  });

  modal.hidden = false;
  document.removeEventListener('keydown', escCloseModal);
  document.addEventListener('keydown', escCloseModal);
  $('#seatModalClose').focus();

  if (!MOTION) return;
  gsap.fromTo(modal, { opacity:0 }, { opacity:1, duration:.2, ease:EASE.out });
  gsap.fromTo(modal.querySelector('.modal'),
    { opacity:0, y:12, scale:.97 }, { opacity:1, y:0, scale:1, duration:.3, ease:EASE.out });
}

function closeSeatModal () {
  const modal = $('#seatModal');
  if (modal.hidden) return;
  document.removeEventListener('keydown', escCloseModal);
  const done = () => { modal.hidden = true; };
  if (!MOTION) return done();
  gsap.to(modal.querySelector('.modal'), { opacity:0, y:8, scale:.98, duration:.18, ease:EASE.in });
  gsap.to(modal, { opacity:0, duration:.18, ease:EASE.in, onComplete:done });
}
function escCloseModal (e) { if (e.key === 'Escape') closeSeatModal(); }

/* ═══════════════════════════════════════════════════════════
   이벤트 바인딩
   ═══════════════════════════════════════════════════════════ */
function moveMonth (step) {
  const n = { y:ym.y, m:ym.m + step };
  if (n.m > 12) { n.m = 1; n.y++; }
  if (n.m < 1)  { n.m = 12; n.y--; }
  if (idx(n) < idx(RANGE.min) || idx(n) > idx(RANGE.max)) return;
  ym = n;
  sheetKey = null;
  closeSheet();
  gridFrom = step < 0 ? 'end' : 'start';
  selDay = defaultSelDay();
  render();
}

function bind () {
  $$('.np-vt button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.view === view) return;
    view = b.dataset.view;
    sheetKey = null;
    closeSheet();
    render();
  }));

  $$('.np-cell[data-day]').forEach(c => c.addEventListener('click', () => {
    selDay = +c.dataset.day;
    skipAnim = true;
    render();
  }));

  $$('.np-entry').forEach(e => e.addEventListener('click', () => {
    const p = perfFromKey(e.dataset.key);
    if (p) openSheet(p);
  }));

  $$('.js-month').forEach(b => b.addEventListener('click', () => moveMonth(+b.dataset.step)));

  const pastToggle = $('#pastToggle');
  if (pastToggle) pastToggle.addEventListener('click', () => { showPast = !showPast; skipAnim = true; render(); });
}

/* ═══ 등장 · 재렌더 애니메이션 ═══ */
function enter () {
  document.documentElement.classList.remove('pre-anim');
  if (!MOTION) return;
  gsap.timeline()
    .from('.np-mast > *', { opacity:0, y:-8, duration:.5, stagger:.07 })
    .from('.np-nav > *',  { opacity:0, y:-6, duration:.4, stagger:.05 }, .12)
    .from('.np-main > *', { opacity:0, y:16, duration:.5, stagger:.1, clearProps:'all' }, .2);
}

function animateBody () {
  if (!MOTION || skipAnim) { skipAnim = false; return; }
  const items = $('#wrap').querySelectorAll('.np-cell[data-day], .np-entry');
  if (!items.length) return;
  gsap.from(items, {
    opacity:0, y:-4, duration:.28,
    stagger:{ amount:Math.min(items.length * .012, .35), from:gridFrom }
  });
  gridFrom = 'start';
}

/* ═══ 로그인 데모 토글 — 실제 인증 없음 ═══ */
$('#loginBtn').addEventListener('click', () => { loggedIn = !loggedIn; skipAnim = true; render(); });
$('#seatModalClose').addEventListener('click', closeSeatModal);
$('#seatModal').addEventListener('click', e => { if (e.target.id === 'seatModal') closeSeatModal(); });
$('#sheetBack').addEventListener('click', closeSheet);

/* ═══ 초기화 ═══ */
$('#todayStamp').textContent =
  `${TODAY.y}년 ${TODAY.m}월 ${TODAY.d}일 ${WD[new Date(TODAY.y, TODAY.m - 1, TODAY.d).getDay()]}요일`;

selDay = defaultSelDay();
skipAnim = true;
render();
enter();
</script>

</body>
</html>
