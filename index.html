<style>
/* ═══════════════════════════════════════════════════════════
   볼살씨 — 스케줄 탭 (PRD_v3 3장)

   디자인: Claude Design 〈Fan Schedule Newspaper〉 — 신문 지면 미감.
   달력형이 이 탭의 중심 화면이고, 목록형은 같은 미감의 지면 기사 열로 둔다
   ("내 달력" 별도 탭 없음 — 관극 여부는 여기서 체크). 회차 클릭 시 하단 시트
   상세: 배역·상대역, 이벤트, (로그인 시) 관극 체크 + 좌석.
   정산판(settlement.html)은 이번 작업에서 손대지 않음.
   ═══════════════════════════════════════════════════════════ */

:root {
  --paper:#e9e3d5; --paper-2:#e3dccb; --paper-3:#ded7c6;
  --ink:#17150f;
  /* 텍스트용 — 종이색(--paper) 위에서 최소 WCAG AA 근처 대비를 확보한 값 */
  --ink-72:rgba(23,21,15,.9);  --ink-60:rgba(23,21,15,.84);
  --ink-55:rgba(23,21,15,.78); --ink-45:rgba(23,21,15,.7);
  /* 아래 둘은 선·테두리 전용 (텍스트에 쓰지 말 것) */
  --ink-40:rgba(23,21,15,.4);  --ink-28:rgba(23,21,15,.28);
  --ink-14:rgba(23,21,15,.14);
  --accent:#8f2e22;

  /* 신문 종이 질감 — SVG 난류로 만든 구김(음영)과 잉크 그레인. 외부 이미지 없음 */
  --crumple:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='560' height='560'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.017' numOctaves='5' seed='9' stitchTiles='stitch' result='t'/><feDiffuseLighting in='t' lighting-color='%23fff' surfaceScale='3.2' diffuseConstant='1'><feDistantLight azimuth='58' elevation='56'/></feDiffuseLighting></filter><rect width='560' height='560' filter='url(%23p)'/><rect width='560' height='560' fill='%23fff' opacity='.5'/></svg>");
  --grain:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='150' height='150' fill='%23fff'/><rect width='150' height='150' filter='url(%23g)' opacity='.3'/></svg>");

  /* 폰트는 themes/elisabeth-2026-6th-lucheni/fonts/fonts.css 에서 로컬 로드 (이 PC는 웹폰트 CDN 이 막힘).
     본문은 카페24 써라운드 에어 — 둥근 획의 고딕. 못 받으면 시스템 고딕으로 폴백.
     헤드라인 한글은 Hahmlet, 라틴은 Playfair 로 신문 인상을 낸다. */
  --fraktur:"UnifrakturMaguntia","Hahmlet","Batang",serif;
  --display:"Playfair Display","Hahmlet","Malgun Gothic","Apple SD Gothic Neo",serif;
  --body:"Cafe24 Ssurround Air","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  /* 숫자·라틴은 IBM Plex Mono, 그 안의 한글은 본문과 같은 카페24 써라운드 에어로 폴백 */
  --mono:"IBM Plex Mono","Cafe24 Ssurround Air","D2Coding",ui-monospace,monospace;
}

* { box-sizing:border-box; margin:0; padding:0; }

/* 구겨진 신문지 — 잉크 그레인(위) → 구김 음영 → 빛 결 → 가장자리 그늘 순으로 겹친다.
   위 두 겹만 multiply라 종이색만 어두워지고 본문 글자 대비에는 영향이 없다. */
body {
  background-color:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:14px; font-weight:600; line-height:1.6;
  font-synthesis:weight;
  -webkit-font-smoothing:antialiased;
  background-image:
    var(--grain),
    var(--crumple),
    radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.5), rgba(0,0,0,0) 55%),
    radial-gradient(100% 50% at 50% 100%, rgba(90,78,55,.14), rgba(0,0,0,0) 70%);
  background-size:150px 150px, 560px 560px, auto, auto;
  background-repeat:repeat, repeat, no-repeat, no-repeat;
  background-blend-mode:multiply, multiply, normal, normal;
  background-attachment:scroll, scroll, fixed, fixed;
}
button, input, select, textarea { font-weight:600; }
[hidden] { display:none !important; }
.mono { font-family:var(--mono); }
a { color:var(--accent); text-decoration:none; }

/* 지면 컬럼은 배경을 두지 않는다 — body의 구김 결이 그대로 이어지게. */
.np-shell {
  max-width:600px; margin:0 auto; min-height:100vh;
  padding:0 18px; display:flex; flex-direction:column;
}
@media (min-width:640px) { .np-shell { border-inline:1px solid var(--ink-14); } }

/* ═══ 마스트헤드 ═══ */
.np-mast { position:relative; flex:none; padding:18px 0 10px; text-align:center; border-bottom:3px double var(--ink); }
.np-login {
  position:absolute; right:0; top:14px;
  border:1px solid var(--ink-40); background:none; color:var(--ink);
  font-family:var(--mono); font-size:12px; letter-spacing:.12em;
  min-height:40px; padding:4px 10px; cursor:pointer;

  z-index:20;
  pointer-events:auto;
  isolation:isolate;}
.np-login:hover { background:var(--ink); color:var(--paper); }
.np-wordmark { font-family:var(--fraktur); font-weight:400; font-size:29px; line-height:1.05; letter-spacing:.01em; margin:2px 0 4px; text-wrap:balance; }
.np-byline {
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  padding-top:6px; border-top:1px solid var(--ink-40);
  font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--ink-60);
}
.np-byline > :first-child { text-align:left; }
.np-byline > :last-child { text-align:right; }
.np-byline .by-name { text-align:center; color:#6B3FA0; font-weight:600; }
.np-mast-slug {
  margin-top:7px; padding-top:6px; border-top:1px solid var(--ink-14);
  font-family:var(--body); font-size:12px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-55); line-height:1.55;
}

/* ═══ 탭 ═══ */
.np-nav {
  flex:none; display:flex; gap:18px; justify-content:center;
  padding:9px 0; border-bottom:1px solid var(--ink-28);
  font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
}
.np-nav [aria-current] { color:var(--ink); border-bottom:2px solid var(--accent); padding-bottom:3px; }
.np-nav a { color:var(--ink-55); }
.np-nav a:hover { color:var(--ink); }

.np-main { flex:1; padding:14px 0 28px; }

.np-foot { flex:none; border-top:3px double var(--ink); padding:12px 0 26px; }
.np-foot p { font-family:var(--mono); font-size:12px; line-height:1.7; letter-spacing:.03em; color:var(--ink-55); }

/* ═══ 뷰 토글 ═══ */
.np-vt { display:flex; width:max-content; margin:0 auto 4px; border:1px solid var(--ink-40); }
.np-vt button {
  border:0; background:none; color:var(--ink-55); cursor:pointer;
  font-family:var(--mono); font-size:12px; letter-spacing:.14em; padding:6px 16px;
}
.np-vt button + button { border-left:1px solid var(--ink-40); }
.np-vt button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }

/* ═══ 다가오는 회차 (지면 헤드라인 + 컷 사진) ═══ */
.np-lead {
  display:grid; grid-template-columns:minmax(0,1fr) clamp(108px, 31%, 176px);
  gap:15px; align-items:start;
  padding:14px 0 13px; border-bottom:1px solid var(--ink-28);
}
.np-lead-kick { font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--accent); text-transform:uppercase; }
.np-lead-ttl { font-family:var(--display); font-weight:900; font-size:22px; line-height:1.14; letter-spacing:-.01em; margin:4px 0 5px; }
.np-lead-deck { font-size:12px; line-height:1.62; color:var(--ink-72); text-wrap:pretty; }
.np-lead-meta { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; font-family:var(--mono); font-size:12px; letter-spacing:.05em; color:var(--ink-60); }
.np-lead-meta .dday { background:var(--ink); color:var(--paper); padding:2px 6px; white-space:nowrap; }

/* ── 컷 사진 + 송곳 구멍 ──
   루케니(강홍석) 사진을 신문 컷처럼 흑백으로 깐다.
   기존 송곳 구멍 마스크 방식은 제거했다. */
.np-lead-fig { margin:0; }
.np-cut {
  position:relative; overflow:hidden; aspect-ratio:4/5;
  border:1px solid var(--ink-40); background:var(--paper-3);
}
/* height:126% + 위 정렬 = 아래 20%(엘리자벳 로고·Luigi Lucheni 자막)를 잘라낸다 */
.np-cut img {
  position:absolute; left:0; top:0;
  display:block; width:100%; height:126%;
  object-fit:cover; object-position:47% 0;
}
.np-lead-fig figcaption {
  margin-top:5px; font-family:var(--mono); font-size:12px;
  letter-spacing:.07em; line-height:1.5; color:var(--ink-55);
}

/* ═══ 달 이동 ═══ */
.np-month { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 0 0; }
.np-month button {
  flex:none; width:26px; height:26px; border:1px solid var(--ink-40);
  background:none; color:var(--ink); font-family:var(--mono); font-size:12px; cursor:pointer;
}
.np-month button:disabled { opacity:.3; cursor:not-allowed; }
.np-month .m-mid { text-align:center; flex:1; }
.np-month .m-ttl { font-family:var(--display); font-weight:700; font-style:italic; font-size:19px; line-height:1; }
.np-month .m-sub { font-family:var(--mono); font-size:12px; letter-spacing:.18em; color:var(--ink-55); margin-top:2px; text-transform:uppercase; }

/* ═══ 달력 격자 ═══ */
.np-cal { margin-top:10px; border-top:2px solid var(--ink); border-bottom:1px solid var(--ink-28); }
.np-dow { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--ink-28); }
.np-dow div { text-align:center; padding:5px 0; font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--ink-60); }
.np-dow .sun { color:var(--accent); }
.np-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
.np-cell {
  min-height:82px; padding:6px 2px 6px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  border-right:1px solid var(--ink-14); border-bottom:1px solid var(--ink-14);
}
.np-cell:nth-child(7n) { border-right:0; }
.np-grid .np-cell:nth-last-child(-n+7) { border-bottom:0; }
.np-cell.pad { opacity:.3; }
.np-cell[data-day] { cursor:pointer; }
.np-cell .n { font-family:var(--display); font-size:13px; font-weight:600; line-height:1; color:var(--ink); }
.np-cell.sun .n { color:rgba(143,46,34,.8); }
.np-cell.today .n { color:var(--accent); font-weight:900; border-bottom:2px solid var(--accent); }
.np-cell.went { outline:2px solid var(--ink); outline-offset:-2px; }
.np-cell-photo {
  width:38px; height:38px; border-radius:50%; object-fit:cover; object-position:50% 28%;
  border:1px solid var(--ink-28); background:var(--paper-3);
}
.np-cell-t { font-family:var(--mono); font-size:12px; letter-spacing:.01em; color:var(--ink-72); line-height:1.2; }
.np-cell-ev {
  max-width:100%; margin-top:1px; padding:0 3px;
  font-family:var(--mono); font-size:12px; letter-spacing:0; line-height:1.45;
  color:var(--accent); border:1px solid rgba(143,46,34,.45);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.np-cell-ev .short { display:none; }

/* ═══ 지면 섹션 (목록형) ═══ */
.np-sec-body { margin-top:8px; }

.np-entry {
  display:grid; grid-template-columns:52px 38px 1fr; gap:10px; align-items:start;
  width:100%; text-align:left; background:none; border:0;
  border-top:1px solid var(--ink-14); padding:11px 0;
  font-family:var(--body); cursor:pointer;
}
.np-entry:first-of-type { border-top:0; }
.np-entry:active { opacity:.55; }
.np-entry .lc { text-align:right; border-right:1px solid var(--ink-14); padding-right:9px; }
.np-entry .lc .big { font-family:var(--display); font-size:17px; font-weight:600; letter-spacing:-.01em; }
.np-entry .lc .sm { font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--ink-55); margin-top:2px; }
.np-entry-photo {
  width:38px; height:38px; border-radius:50%; object-fit:cover; object-position:50% 28%;
  border:1px solid var(--ink-28); background:var(--paper-3); margin-top:1px;
}
.np-entry .tags { display:flex; flex-wrap:wrap; align-items:center; gap:5px 6px; }
.np-entry .cat { font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--ink-55); font-style:normal; text-transform:uppercase; }
.np-entry.went .cat { color:var(--accent); }
/* 담은 회차 — 달력·목록 모두 굵은 테두리로 표시 (레이아웃은 밀지 않게 outline) */
.np-entry.went { outline:2px solid var(--ink); outline-offset:-2px; }
.np-entry .ttl { display:block; font-weight:700; font-size:14px; line-height:1.35; letter-spacing:-.01em; margin:3px 0; }
.np-entry .place { display:block; font-size:12px; color:var(--ink-60); }
.np-entry.past { opacity:.5; }
.np-mini {
  font-family:var(--mono); font-size:12px; letter-spacing:.04em; font-style:normal;
  border:1px solid var(--ink-28); padding:1px 5px; color:var(--ink-60);
}
.np-mini.unv, .np-mini.hist { color:var(--accent); border-color:rgba(143,46,34,.4); }
.np-mini.went { background:var(--ink); color:var(--paper); border-color:var(--ink); }

.np-empty { border-top:1px solid var(--ink-14); padding:24px 0; text-align:center; }
.np-empty .h { font-family:var(--display); font-style:italic; font-size:15px; color:var(--ink-55); }
.np-empty .s { font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--ink-55); margin-top:5px; }

.np-past {
  display:block; width:100%; padding:11px; margin-top:2px;
  background:none; border:0; border-top:1px solid var(--ink-28);
  font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--ink-55); cursor:pointer;
}
.np-past:hover { color:var(--ink); }

/* ═══ 예매 버튼 ═══ */
.np-book {
  margin-top:16px; border-top:1px solid var(--ink-28); border-bottom:1px solid var(--ink-28);
  padding:12px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.np-book-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:12px 8px; border:1px solid var(--ink); background:var(--paper);
  text-decoration:none; color:var(--ink);
}
.np-book-btn:hover { background:var(--ink); color:var(--paper); }
.np-book-btn .lbl { font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--ink-55); text-transform:uppercase; }
.np-book-btn:hover .lbl { color:var(--paper); }
.np-book-btn b { font-family:var(--display); font-weight:700; font-size:16px; }

/* 공식 채널 3칸 (예매 버튼 아래) */
.np-links {
  padding:12px 0; border-bottom:1px solid var(--ink-28);
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
}
.np-links .np-book-btn { padding:10px 4px; gap:2px; }
.np-links .np-book-btn .lbl { font-size:12px; letter-spacing:.08em; }
.np-links .np-book-btn b { font-size:14px; }

.np-listhead { display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:4px 0 2px; }
.np-listhead h3 { font-family:var(--display); font-weight:700; font-size:15px; }
.np-listhead .cnt { font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--ink-55); }

/* ═══ 회차 상세 (하단 시트) ═══ */
.np-sheet-wrap { position:fixed; inset:0; z-index:40; }
.np-sheet-back { position:absolute; inset:0; background:rgba(15,14,10,.55); }
.np-sheet {
  position:absolute; left:0; right:0; bottom:0; max-width:600px; margin:0 auto;
  background-color:var(--paper);
  background-image:var(--grain), var(--crumple);
  background-size:150px 150px, 560px 560px;
  background-blend-mode:multiply, multiply;
  border-top:3px double var(--ink);
  padding:14px 20px 22px; max-height:84vh; overflow-y:auto;
}
.np-sheet-head { display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--ink-55); text-transform:uppercase; }
.np-x { border:0; background:none; font-family:var(--mono); font-size:13px; cursor:pointer; color:var(--ink); }
.np-sheet-ttl { font-family:var(--display); font-weight:900; font-size:22px; line-height:1.16; letter-spacing:-.01em; margin:7px 0 2px; }

}

.np-hr { height:1px; background:var(--ink-28); margin:10px 0; }
.np-cast { width:100%; border-collapse:collapse; font-size:13px; }
.np-cast caption {

}

.np-cast td { display:flex; align-items:baseline; justify-content:space-between; gap:8px; min-width:0; }

.np-cast .on { display:block; flex:none; padding:0; background:none; color:var(--ink); font-weight:700; }
.np-cast .alt {
  display:block; min-width:0; flex:1; margin-top:0; overflow:hidden; text-align:right; text-overflow:ellipsis; white-space:nowrap;
  font-weight:600; font-family:var(--mono); font-size:12px; letter-spacing:.02em; color:var(--ink-45);
}

.np-check { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; }

.np-btn {
  border:1px solid var(--ink); background:none; color:var(--ink); cursor:pointer;
  font-family:var(--mono); font-size:12px; letter-spacing:.1em; padding:10px 14px;
}
.np-btn.solid { background:var(--ink); color:var(--paper); }
.np-btn.ghost { border-color:var(--ink-40); }
.np-btn:disabled { opacity:.4; cursor:not-allowed; }
.np-sheet-foot { margin-top:12px; text-align:center; font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--ink-55); }

/* ── 좌석 선택 — 층 · 열 · 번호 선택지 ── */
.np-seatsel { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:10px; }
.np-seatsel .lbl { font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--ink-55); text-transform:uppercase; }
.np-seatsel select {
  border:1px solid var(--ink-40); background:var(--paper-3); color:var(--ink); cursor:pointer;
  font-family:var(--mono); font-size:12px; padding:7px 9px; border-radius:0;
}
.np-seatsel select:hover { border-color:var(--ink); }
/* 좌석 배치도 — 좌석번호를 그대로 grid-column으로 써서 실제 부채꼴 배열을 만든다 */
.stage-bar {
  margin:12px 0 10px; padding:5px 0; text-align:center;
  background:var(--ink-14); border:1px solid var(--ink-28);
  font-family:var(--mono); font-size:12px; letter-spacing:.4em; color:var(--ink-60);
}

/* ═══ 등장 애니메이션 대기 ═══ */
.pre-anim .np-mast > *, .pre-anim .np-nav > *, .pre-anim .np-main > * { opacity:0; }

}
