<style>
/* ═══════════════════════════════════════════════════════════
   볼살씨 — 스케줄 탭 (PRD_v3 3장)

   디자인: Claude Design 〈Fan Schedule Newspaper〉 — 신문 지면 미감.
   달력형이 이 탭의 중심 화면이고, 목록형은 같은 미감의 지면 기사 열로 둔다
   ("내 달력" 별도 탭 없음 — 관극 여부는 여기서 체크). 회차 클릭 시 하단 시트
   상세: 배역·상대역, 이벤트, (로그인 시) 관극 체크 + 좌석.
   정산판(settlement.html)은 이번 작업에서 손대지 않음.
   ═══════════════════════════════════════════════════════════ */

:root {
  --paper:#e9e3d5; --paper-2:#e3dccb; --paper-3:#ded7c6;
  --ink:#17150f;
  /* 텍스트용 — 종이색(--paper) 위에서 최소 WCAG AA 근처 대비를 확보한 값 */
  --ink-72:rgba(23,21,15,.9);  --ink-60:rgba(23,21,15,.84);
  --ink-55:rgba(23,21,15,.78); --ink-45:rgba(23,21,15,.7);
  /* 아래 둘은 선·테두리 전용 (텍스트에 쓰지 말 것) */
  --ink-40:rgba(23,21,15,.4);  --ink-28:rgba(23,21,15,.28);
  --ink-14:rgba(23,21,15,.14);
  --accent:#8f2e22;

  /* 신문 종이 질감 — SVG 난류로 만든 구김(음영)과 잉크 그레인. 외부 이미지 없음 */
  --crumple:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='560' height='560'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.017' numOctaves='5' seed='9' stitchTiles='stitch' result='t'/><feDiffuseLighting in='t' lighting-color='%23fff' surfaceScale='3.2' diffuseConstant='1'><feDistantLight azimuth='58' elevation='56'/></feDiffuseLighting></filter><rect width='560' height='560' filter='url(%23p)'/><rect width='560' height='560' fill='%23fff' opacity='.5'/></svg>");
  --grain:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='150' height='150' fill='%23fff'/><rect width='150' height='150' filter='url(%23g)' opacity='.3'/></svg>");

  /* 폰트는 themes/elisabeth-2026-6th-lucheni/fonts/fonts.css 에서 로컬 로드 (이 PC는 웹폰트 CDN 이 막힘).
     본문은 카페24 써라운드 에어 — 둥근 획의 고딕. 못 받으면 시스템 고딕으로 폴백.
     헤드라인 한글은 Hahmlet, 라틴은 Playfair 로 신문 인상을 낸다. */
  --fraktur:"UnifrakturMaguntia","Hahmlet","Batang",serif;
  --display:"Playfair Display","Hahmlet","Malgun Gothic","Apple SD Gothic Neo",serif;
  --body:"Cafe24 Ssurround Air","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  /* 숫자·라틴은 IBM Plex Mono, 그 안의 한글은 본문과 같은 카페24 써라운드 에어로 폴백 */
  --mono:"IBM Plex Mono","Cafe24 Ssurround Air","D2Coding",ui-monospace,monospace;
}

* { box-sizing:border-box; margin:0; padding:0; }

/* 구겨진 신문지 — 잉크 그레인(위) → 구김 음영 → 빛 결 → 가장자리 그늘 순으로 겹친다.
   위 두 겹만 multiply라 종이색만 어두워지고 본문 글자 대비에는 영향이 없다. */
body {
  background-color:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:14px; font-weight:600; line-height:1.6;
  font-synthesis:weight;
  -webkit-font-smoothing:antialiased;
  background-image:
    var(--grain),
    var(--crumple),
    radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.5), rgba(0,0,0,0) 55%),
    radial-gradient(100% 50% at 50% 100%, rgba(90,78,55,.14), rgba(0,0,0,0) 70%);
  background-size:150px 150px, 560px 560px, auto, auto;
  background-repeat:repeat, repeat, no-repeat, no-repeat;
  background-blend-mode:multiply, multiply, normal, normal;
  background-attachment:scroll, scroll, fixed, fixed;
}
button, input, select, textarea { font-weight:600; }
[hidden] { display:none !important; }
.mono { font-family:var(--mono); }
a { color:var(--accent); text-decoration:none; }

/* 지면 컬럼은 배경을 두지 않는다 — body의 구김 결이 그대로 이어지게. */
.np-shell {
  max-width:600px; margin:0 auto; min-height:100vh;
  padding:0 18px; display:flex; flex-direction:column;
}
@media (min-width:640px) { .np-shell { border-inline:1px solid var(--ink-14); } }

/* ═══ 마스트헤드 ═══ */
.np-mast { position:relative; flex:none; padding:18px 0 10px; text-align:center; border-bottom:3px double var(--ink); }
.np-login {
  position:absolute; right:0; top:14px;
  border:1px solid var(--ink-40); background:none; color:var(--ink);
  font-family:var(--mono); font-size:12px; letter-spacing:.12em;
  min-height:40px; padding:4px 10px; cursor:pointer;

  z-index:20;
  pointer-events:auto;
  isolation:isolate;}
.np-login:hover { background:var(--ink); color:var(--paper); }
.np-wordmark { font-family:var(--fraktur); font-weight:400; font-size:29px; line-height:1.05; letter-spacing:.01em; margin:2px 0 4px; text-wrap:balance; }
.np-byline {
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  padding-top:6px; border-top:1px solid var(--ink-40);
  font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--ink-60);
}
.np-byline > :first-child { text-align:left; }
.np-byline > :last-child { text-align:right; }
.np-byline .by-name { text-align:center; color:#6B3FA0; font-weight:600; }
.np-mast-slug {
  margin-top:7px; padding-top:6px; border-top:1px solid var(--ink-14);
  font-family:var(--body); font-size:12px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-55); line-height:1.55;
}

/* ═══ 탭 ═══ */
.np-nav {
  flex:none; display:flex; gap:18px; justify-content:center;
  padding:9px 0; border-bottom:1px solid var(--ink-28);
  font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
}
.np-nav [aria-current] { color:var(--ink); border-bottom:2px solid var(--accent); padding-bottom:3px; }
.np-nav a { color:var(--ink-55); }
.np-nav a:hover { color:var(--ink); }

.np-main { flex:1; padding:14px 0 28px; }

.np-foot { flex:none; border-top:3px double var(--ink); padding:12px 0 26px; }
.np-foot p { font-family:var(--mono); font-size:12px; line-height:1.7; letter-spacing:.03em; color:var(--ink-55); }

/* ═══ 뷰 토글 ═══ */
.np-vt { display:flex; width:max-content; margin:0 auto 4px; border:1px solid var(--ink-40); }
.np-vt button {
  border:0; background:none; color:var(--ink-55); cursor:pointer;
  font-family:var(--mono); font-size:12px; letter-spacing:.14em; padding:6px 16px;
}
.np-vt button + button { border-left:1px solid var(--ink-40); }
.np-vt button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }

/* ═══ 다가오는 회차 (지면 헤드라인 + 컷 사진) ═══ */
.np-lead {
  display:grid; grid-template-columns:minmax(0,1fr) clamp(108px, 31%, 176px);
  gap:15px; align-items:start;
  padding:14px 0 13px; border-bottom:1px solid var(--ink-28);
}
.np-lead-kick { font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--accent); text-transform:uppercase; }
.np-lead-ttl { font-family:var(--display); font-weight:900; font-size:22px; line-height:1.14; letter-spacing:-.01em; margin:4px 0 5px; }
.np-lead-deck { font-size:12px; line-height:1.62; color:var(--ink-72); text-wrap:pretty; }
.np-lead-meta { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; font-family:var(--mono); font-size:12px; letter-spacing:.05em; color:var(--ink-60); }
.np-lead-meta .dday { background:var(--ink); color:var(--paper); padding:2px 6px; white-space:nowrap; }

/* ── 컷 사진 + 송곳 구멍 ──
   루케니(강홍석) 사진을 신문 컷처럼 흑백으로 깐다.
   기존 송곳 구멍 마스크 방식은 제거했다. */
.np-lead-fig { margin:0; }
.np-cut {
  position:relative; overflow:hidden; aspect-ratio:4/5;
  border:1px solid var(--ink-40); background:var(--paper-3);
}
/* height:126% + 위 정렬 = 아래 20%(엘리자벳 로고·Luigi Lucheni 자막)를 잘라낸다 */
.np-cut img {
  position:absolute; left:0; top:0;
  display:block; width:100%; height:126%;
  object-fit:cover; object-position:47% 0;
}
.np-lead-fig figcaption {
  margin-top:5px; font-family:var(--mono); font-size:12px;
  letter-spacing:.07em; line-height:1.5; color:var(--ink-55);
}

/* ═══ 달 이동 ═══ */
.np-month { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 0 0; }
.np-month button {
  flex:none; width:26px; height:26px; border:1px solid var(--ink-40);
  background:none; color:var(--ink); font-family:var(--mono); font-size:12px; cursor:pointer;
}
.np-month button:disabled { opacity:.3; cursor:not-allowed; }
.np-month .m-mid { text-align:center; flex:1; }
.np-month .m-ttl { font-family:var(--display); font-weight:700; font-style:italic; font-size:19px; line-height:1; }
.np-month .m-sub { font-family:var(--mono); font-size:12px; letter-spacing:.18em; color:var(--ink-55); margin-top:2px; text-transform:uppercase; }

/* ═══ 달력 격자 ═══ */
.np-cal { margin-top:10px; border-top:2px solid var(--ink); border-bottom:1px solid var(--ink-28); }
.np-dow { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--ink-28); }
.np-dow div { text-align:center; padding:5px 0; font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--ink-60); }
.np-dow .sun { color:var(--accent); }
.np-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
.np-cell {
  min-height:82px; padding:6px 2px 6px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  border-right:1px solid var(--ink-14); border-bottom:1px solid var(--ink-14);
}
.np-cell:nth-child(7n) { border-right:0; }
.np-grid .np-cell:nth-last-child(-n+7) { border-bottom:0; }
.np-cell.pad { opacity:.3; }
.np-cell[data-day] { cursor:pointer; }
.np-cell .n { font-family:var(--display); font-size:13px; font-weight:600; line-height:1; color:var(--ink); }
.np-cell.sun .n { color:rgba(143,46,34,.8); }
.np-cell.today .n { color:var(--accent); font-weight:900; border-bottom:2px solid var(--accent); }
.np-cell.went { outline:2px solid var(--ink); outline-offset:-2px; }
.np-cell-photo {
  width:38px; height:38px; border-radius:50%; object-fit:cover; object-position:50% 28%;
  border:1px solid var(--ink-28); background:var(--paper-3);
}
.np-cell-t { font-family:var(--mono); font-size:12px; letter-spacing:.01em; color:var(--ink-72); line-height:1.2; }
.np-cell-ev {
  max-width:100%; margin-top:1px; padding:0 3px;
  font-family:var(--mono); font-size:12px; letter-spacing:0; line-height:1.45;
  color:var(--accent); border:1px solid rgba(143,46,34,.45);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.np-cell-ev .short { display:none; }

/* ═══ 지면 섹션 (목록형) ═══ */
.np-sec-body { margin-top:8px; }

.np-entry {
  display:grid; grid-template-columns:52px 38px 1fr; gap:10px; align-items:start;
  width:100%; text-align:left; background:none; border:0;
  border-top:1px solid var(--ink-14); padding:11px 0;
  font-family:var(--body); cursor:pointer;
}
.np-entry:first-of-type { border-top:0; }
.np-entry:active { opacity:.55; }
.np-entry .lc { text-align:right; border-right:1px solid var(--ink-14); padding-right:9px; }
.np-entry .lc .big { font-family:var(--display); font-size:17px; font-weight:600; letter-spacing:-.01em; }
.np-entry .lc .sm { font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--ink-55); margin-top:2px; }
.np-entry-photo {
  width:38px; height:38px; border-radius:50%; object-fit:cover; object-position:50% 28%;
  border:1px solid var(--ink-28); background:var(--paper-3); margin-top:1px;
}
.np-entry .tags { display:flex; flex-wrap:wrap; align-items:center; gap:5px 6px; }
.np-entry .cat { font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--ink-55); font-style:normal; text-transform:uppercase; }
.np-entry.went .cat { color:var(--accent); }
/* 담은 회차 — 달력·목록 모두 굵은 테두리로 표시 (레이아웃은 밀지 않게 outline) */
.np-entry.went { outline:2px solid var(--ink); outline-offset:-2px; }
.np-entry .ttl { display:block; font-weight:700; font-size:14px; line-height:1.35; letter-spacing:-.01em; margin:3px 0; }
.np-entry .place { display:block; font-size:12px; color:var(--ink-60); }
.np-entry.past { opacity:.5; }
.np-mini {
  font-family:var(--mono); font-size:12px; letter-spacing:.04em; font-style:normal;
  border:1px solid var(--ink-28); padding:1px 5px; color:var(--ink-60);
}
.np-mini.unv, .np-mini.hist { color:var(--accent); border-color:rgba(143,46,34,.4); }
.np-mini.went { background:var(--ink); color:var(--paper); border-color:var(--ink); }

.np-empty { border-top:1px solid var(--ink-14); padding:24px 0; text-align:center; }
.np-empty .h { font-family:var(--display); font-style:italic; font-size:15px; color:var(--ink-55); }
.np-empty .s { font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--ink-55); margin-top:5px; }

.np-past {
  display:block; width:100%; padding:11px; margin-top:2px;
  background:none; border:0; border-top:1px solid var(--ink-28);
  font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--ink-55); cursor:pointer;
}
.np-past:hover { color:var(--ink); }

/* ═══ 예매 버튼 ═══ */
.np-book {
  margin-top:16px; border-top:1px solid var(--ink-28); border-bottom:1px solid var(--ink-28);
  padding:12px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.np-book-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:12px 8px; border:1px solid var(--ink); background:var(--paper);
  text-decoration:none; color:var(--ink);
}
.np-book-btn:hover { background:var(--ink); color:var(--paper); }
.np-book-btn .lbl { font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--ink-55); text-transform:uppercase; }
.np-book-btn:hover .lbl { color:var(--paper); }
.np-book-btn b { font-family:var(--display); font-weight:700; font-size:16px; }

/* 공식 채널 3칸 (예매 버튼 아래) */
.np-links {
  padding:12px 0; border-bottom:1px solid var(--ink-28);
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
}
.np-links .np-book-btn { padding:10px 4px; gap:2px; }
.np-links .np-book-btn .lbl { font-size:12px; letter-spacing:.08em; }
.np-links .np-book-btn b { font-size:14px; }

.np-listhead { display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:4px 0 2px; }
.np-listhead h3 { font-family:var(--display); font-weight:700; font-size:15px; }
.np-listhead .cnt { font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--ink-55); }

/* ═══ 회차 상세 (하단 시트) ═══ */
.np-sheet-wrap { position:fixed; inset:0; z-index:40; }
.np-sheet-back { position:absolute; inset:0; background:rgba(15,14,10,.55); }
.np-sheet {
  position:absolute; left:0; right:0; bottom:0; max-width:600px; margin:0 auto;
  background-color:var(--paper);
  background-image:var(--grain), var(--crumple);
  background-size:150px 150px, 560px 560px;
  background-blend-mode:multiply, multiply;
  border-top:3px double var(--ink);
  padding:14px 20px 22px; max-height:84vh; overflow-y:auto;
}
.np-sheet-head { display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--ink-55); text-transform:uppercase; }
.np-x { border:0; background:none; font-family:var(--mono); font-size:13px; cursor:pointer; color:var(--ink); }
.np-sheet-ttl { font-family:var(--display); font-weight:900; font-size:22px; line-height:1.16; letter-spacing:-.01em; margin:7px 0 2px; }
.np-sheet-sub { font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--ink-60); }
.np-sheet-kicker { display:flex; flex-wrap:wrap; align-items:center; gap:5px 6px; margin-top:9px; }
.np-sheet-kicker .cat { font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--ink-55); text-transform:uppercase; font-style:normal; }
.np-sheet-show { font-family:var(--display); font-weight:700; font-size:15px; line-height:1.35; margin:7px 0 3px; }
.np-sheet-show span { font-weight:600; font-size:13px; color:var(--ink-60); }
.np-sheet-switch { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.np-sw {
  border:1px solid var(--ink-40); background:none; color:var(--ink-60); cursor:pointer;
  font-family:var(--mono); font-size:12px; letter-spacing:.06em; padding:5px 11px;
}
.np-sw.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
.np-hr { height:1px; background:var(--ink-28); margin:10px 0; }
.np-cast { width:100%; border-collapse:collapse; font-size:13px; }
.np-cast caption {
  caption-side:top; text-align:left; padding-bottom:5px;
  font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--ink-55); text-transform:uppercase;
}
.np-cast caption span { color:var(--ink-55); letter-spacing:.02em; text-transform:none; }
.np-cast th, .np-cast td { text-align:left; padding:7px 0; border-bottom:1px solid var(--ink-14); vertical-align:top; }
.np-cast td { display:flex; align-items:baseline; justify-content:space-between; gap:8px; min-width:0; }
.np-cast th { width:70px; font-weight:600; color:var(--ink-55); font-family:var(--mono); font-size:12px; letter-spacing:.08em; }
.np-cast .on { display:block; flex:none; padding:0; background:none; color:var(--ink); font-weight:700; }
.np-cast .alt {
  display:block; min-width:0; flex:1; margin-top:0; overflow:hidden; text-align:right; text-overflow:ellipsis; white-space:nowrap;
  font-weight:600; font-family:var(--mono); font-size:12px; letter-spacing:.02em; color:var(--ink-45);
}
.np-badges { display:flex; flex-wrap:wrap; gap:5px; margin-top:12px; }
.np-badge { font-family:var(--mono); font-size:12px; letter-spacing:.05em; border:1px solid var(--ink-28); padding:2px 6px; color:var(--ink-60); }
.np-badge.unv { color:var(--accent); border-color:rgba(143,46,34,.4); }
.np-noev { margin-top:12px; font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--ink-55); }
.np-hist { margin-top:12px; padding:10px 12px; background:var(--paper-3); border-left:3px solid var(--accent); font-size:12px; line-height:1.5; }
.np-hist b { display:block; margin-bottom:3px; color:var(--accent); font-family:var(--mono); font-size:12px; letter-spacing:.08em; }
.np-hist span { display:block; margin-top:3px; font-family:var(--mono); font-size:12px; color:var(--ink-55); }
.np-check { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; }
.np-check .hint { font-family:var(--mono); font-size:12px; letter-spacing:.04em; color:var(--ink-55); }
.np-btn {
  border:1px solid var(--ink); background:none; color:var(--ink); cursor:pointer;
  font-family:var(--mono); font-size:12px; letter-spacing:.1em; padding:10px 14px;
}
.np-btn.solid { background:var(--ink); color:var(--paper); }
.np-btn.ghost { border-color:var(--ink-40); }
.np-btn:disabled { opacity:.4; cursor:not-allowed; }
.np-sheet-foot { margin-top:12px; text-align:center; font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--ink-55); }

/* ── 좌석 선택 — 층 · 열 · 번호 선택지 ── */
.np-seatsel { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:10px; }
.np-seatsel .lbl { font-family:var(--mono); font-size:12px; letter-spacing:.1em; color:var(--ink-55); text-transform:uppercase; }
.np-seatsel select {
  border:1px solid var(--ink-40); background:var(--paper-3); color:var(--ink); cursor:pointer;
  font-family:var(--mono); font-size:12px; padding:7px 9px; border-radius:0;
}
.np-seatsel select:hover { border-color:var(--ink); }
/* 좌석 배치도 — 좌석번호를 그대로 grid-column으로 써서 실제 부채꼴 배열을 만든다 */
.stage-bar {
  margin:12px 0 10px; padding:5px 0; text-align:center;
  background:var(--ink-14); border:1px solid var(--ink-28);
  font-family:var(--mono); font-size:12px; letter-spacing:.4em; color:var(--ink-60);
}

/* ═══ 등장 애니메이션 대기 ═══ */
.pre-anim .np-mast > *, .pre-anim .np-nav > *, .pre-anim .np-main > * { opacity:0; }

/* ═══ 반응형 ═══ */
@media (max-width:600px) {
  .np-mast { padding-top:56px; }
  .np-login { top:6px; min-height:44px; }
  .np-shell { padding:0 14px; }
  .np-cell-ev .full { display:none; }
  .np-cell-ev .short { display:inline; }
  .np-wordmark { font-size:21px; }
  .np-cell { min-height:68px; }
  .np-cell-photo { width:30px; height:30px; }
  .np-entry { grid-template-columns:44px 32px 1fr; gap:9px; }
  .np-entry-photo { width:32px; height:32px; }
  .np-lead { gap:12px; }
  .np-lead-ttl { font-size:19px; }
}
</style>

<!-- 등장 애니메이션이 깜빡이지 않도록 본문보다 먼저 GSAP을 받아 둔다. -->
<script src="assets/common/gsap.min.js"></script>
<script>
(function () {
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (typeof gsap === 'undefined' || reduced) return;
  document.documentElement.classList.add('pre-anim');
  setTimeout(function () { document.documentElement.classList.remove('pre-anim'); }, 1200);
})();
</script>
</head>
<body>

<div class="np-shell">
  <header class="np-mast" id="mast">
    <button type="button" class="np-login" id="loginBtn">로그인</button>
    <h1 class="np-wordmark">Neue Zürcher Zeitung</h1>
    <div class="np-byline"><span></span><span class="by-name">강홍석</span><span id="todayStamp"></span></div>
    <p class="np-mast-slug">Austrian Empress Elizabeth &middot; Hotel in Ghenf &middot; &ldquo;View Rivage&rdquo;</p>
  </header>

  <nav class="np-nav" aria-label="주 메뉴">
    <span aria-current="page">스케줄</span>
    <a href="settlement.html">정산판</a>
  </nav>

  <main class="np-main" id="wrap"></main>

  <footer class="np-foot">
    <p>© <span class="mono">2026</span> · 회차별 캐스팅과 이벤트 정보는 제작사 공식 공지를 1차 출처로 합니다.
       일정·캐스팅은 배우 및 제작사 사정으로 사전 공지 없이 변경될 수 있습니다.</p>
  </footer>
</div>

<!-- 회차 상세 — #wrap 재렌더와 무관하게 열림 상태를 유지하려 별도 정적 노드로 둔다 -->
<div class="np-sheet-wrap" id="sheet" hidden>
  <div class="np-sheet-back" id="sheetBack"></div>
  <div class="np-sheet" role="dialog" aria-modal="true" aria-label="회차 상세" id="sheetBody"></div>
</div>


<!-- 공용 데이터 · 헬퍼 (정산판 탭과 공유) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="productions/elisabeth-2026-6th/data/schedule.js"></script>
<script src="data.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   모션 — GSAP 3.15 (settlement.html과 같은 값)
   ═══════════════════════════════════════════════════════════ */
const $$ = s => document.querySelectorAll(s);
const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
const MOTION = typeof gsap !== 'undefined' && !mq('(prefers-reduced-motion: reduce)');

if (!MOTION) console.warn('[볼살씨] 모션 꺼짐 — ' + (typeof gsap === 'undefined'
  ? 'GSAP을 불러오지 못했습니다 (CDN 차단 · 오프라인)'
  : '브라우저가 prefers-reduced-motion: reduce 를 요청했습니다'));

const EASE = { out:'expo.out', in:'power2.out', pop:'back.out(1.5)' };
if (MOTION) gsap.defaults({ ease:EASE.out, duration:.36 });

const MONTH_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD_NAME = ['일','월','화','수','목','금','토'];   // getDay() 인덱스용
const WD = ['월','화','수','목','금','토','일'];        // 달력 표시 순서 — 월요일 시작
const wcol = d => (d + 6) % 7;                          // getDay() → 달력 열 위치 (0=월 … 6=일)
const dowShort = p => WD_NAME[new Date(p.y, p.m - 1, p.d).getDay()];

/* ═══════════════════════════════════════════════════════════
   상태
   ═══════════════════════════════════════════════════════════ */
let view = 'calendar';                 // 'calendar' | 'list' — 달력형이 이 탭의 중심
let ym = { y:TODAY.y, m:TODAY.m };      // 달력형에서 보고 있는 달
let showPast = false;                   // 목록형에서 지난 회차 펼침 여부
let sheetKey = null;                    // 열린 상세 시트의 perfKey
/* 로그인 상태는 Supabase 세션이 결정한다 (data.js mountAuth). 시작은 로그아웃. */
let loggedIn = false;
let skipAnim = false;
let gridFrom = 'start';

const inMonth = p => p.y === ym.y && p.m === ym.m;
const monthPerfs = () => hongPerfs().filter(inMonth).sort(cmpPerf);

/* 달력 셀 안에 넣는 배우 사진 (강홍석 · 엘리자벳 루케니 공식 프로필).
   관리자 업로드 사진으로 교체 시 이 경로만 바꾸면 된다 (PRD_v3 3.1 / 3.2). */
const PHOTO = 'themes/elisabeth-2026-6th-lucheni/assets/schedule/calendar-photo.jpg';

/* 헤드라인 옆 컷 사진 — 루케니 무대컷. 송곳 실루엣이 이 위를 뚫고 지나간다. */
const LEAD_PHOTO = 'themes/elisabeth-2026-6th-lucheni/assets/schedule/lead-photo.jpg';

/* ═══════════════════════════════════════════════════════════
   렌더
   ═══════════════════════════════════════════════════════════ */
function render () {
  document.body.classList.toggle('logged-in', loggedIn);
  $('#loginBtn').textContent = loggedIn ? '로그아웃' : '로그인';
  $('#wrap').innerHTML = viewTabsHTML() + (view === 'calendar' ? calendarHTML() : listHTML());
  bind();
  animateBody();
}

function viewTabsHTML () {
  return `<div class="np-vt" role="tablist" aria-label="보기 전환">
    <button type="button" role="tab" data-view="calendar" aria-pressed="${view === 'calendar'}">달력</button>
    <button type="button" role="tab" data-view="list" aria-pressed="${view === 'list'}">목록</button>
  </div>`;
}

/* ── 다가오는 회차 (지면 헤드라인) ── */
function leadHTML () {
  const up = hongPerfs().filter(p => !isPast(p)).sort(cmpPerf);
  const p = up[0] || hongPerfs().sort(cmpPerf).slice(-1)[0];
  if (!p) return '';
  const diff = Math.round((new Date(p.y, p.m - 1, p.d) - new Date(TODAY.y, TODAY.m - 1, TODAY.d)) / 86400000);
  const dday = diff === 0 ? 'D-DAY' : diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff);
  const role = (hongRole(p) || {}).name || '';

  let deck;
  if ((p.events || []).length) deck = `${p.events.map(e => e.label).join(' · ')} 등 회차 이벤트가 예정돼 있습니다.`;
  else if (p.history) deck = `직전 캐스팅 변경이 반영된 회차입니다.`;
  else deck = `${ACTORS[HONG].name} 배우의 출연이 예정된 회차입니다.`;

  return `<section class="np-lead">
    <div class="np-lead-text">
      <div class="np-lead-kick">다가오는 회차</div>
      <h2 class="np-lead-ttl">뮤지컬 &lsquo;${WORK.title}&rsquo;${role ? ` ${role} 역` : ''}</h2>
      <p class="np-lead-deck">${deck}</p>
      <div class="np-lead-meta">
        <span class="dday">${dday}</span>
        <span>${p.m}월 ${p.d}일 ${dowShort(p)} · ${p.t}${WORK.venue ? ' · ' + WORK.venue : ''}</span>
      </div>
    </div>
    <figure class="np-lead-fig">
      <div class="np-cut">
        <img src="${LEAD_PHOTO}" alt="${ACTORS[HONG].name} — ${role || '루케니'} 무대컷" loading="lazy">
      </div>
      <figcaption>Luigi Lucheni · ${ACTORS[HONG].name}</figcaption>
    </figure>
  </section>`;
}

/* ── 지면 기사 한 줄 (목록형) ── */
function entryHTML (p, extra) {
  const key = perfKey(p);
  const role = (hongRole(p) || {}).name || '';
  const went = loggedIn && !!recordFor(p);

  const badges = [
    ...(p.events || []).map(e => `<em class="np-mini${e.verified ? '' : ' unv'}">${e.label}${e.verified ? '' : ' · 미검증'}</em>`),
    p.history ? `<em class="np-mini hist">캐스팅 변경</em>` : '',
    went ? `<em class="np-mini went">✓ 담음</em>` : ''
  ].filter(Boolean).join('');

  return `<button type="button" class="np-entry${went ? ' went' : ''}${extra ? ' ' + extra : ''}" data-key="${key}">
    <div class="lc"><div class="big">${p.d}</div><div class="sm">${p.m}월 ${dowShort(p)}</div></div>
    <img class="np-entry-photo" src="${PHOTO}" alt="" loading="lazy">
    <div>
      <div class="tags"><em class="cat">뮤지컬 회차</em>${badges}</div>
      <span class="ttl">${WORK.title}${role ? ` — ${role} 역` : ''}</span>
      <span class="place">${WORK.venue || '극장 미정 · 공식 공지 예정'}</span>
    </div>
  </button>`;
}

/* ═══ 달력형 ═══ */
function calendarHTML () {
  const list = monthPerfs();
  const byDay = {};
  list.forEach(p => (byDay[p.d] = byDay[p.d] || []).push(p));

  const first = wcol(firstDow(ym.y, ym.m));   // 월요일 시작 기준 앞 여백
  const dim = daysIn(ym.y, ym.m);
  const totalCells = Math.ceil((first + dim) / 7) * 7;

  let cells = '';
  for (let i = 0; i < totalCells; i++) {
    const day = i - first + 1;
    if (day < 1 || day > dim) { cells += `<div class="np-cell pad"></div>`; continue; }
    const dItems = (byDay[day] || []).sort((a, b) => a.t.localeCompare(b.t));
    const isToday = ym.y === TODAY.y && ym.m === TODAY.m && day === TODAY.d;
    const isSun = (i % 7) === 6;   // 일요일 = 마지막 열
    const dWent = loggedIn && dItems.some(p => recordFor(p));   // 담은 회차가 있는 날
    const cls = ['np-cell', isToday ? 'today' : '', isSun ? 'sun' : '', dWent ? 'went' : ''].join(' ').replace(/\s+/g, ' ').trim();
    const dEvents = dItems.flatMap(p => p.events || []);
    const eventLabel = dEvents[0]?.label || '';
    const eventText = eventLabel === '커튼콜데이'
      ? '<span class="full">커튼콜데이</span><span class="short">커튼콜</span>'
      : eventLabel;
    const inner = dItems.length
      ? `<img class="np-cell-photo" src="${PHOTO}" alt="${ACTORS[HONG].name}" loading="lazy">
         <span class="np-cell-t">${dItems.map(p => p.t).join('·')}</span>
         ${dEvents.length ? `<span class="np-cell-ev">${eventText}${dEvents.length > 1 ? ' +' + (dEvents.length - 1) : ''}</span>` : ''}`
      : '';
    cells += `<div class="${cls}" data-day="${day}">
      <span class="n">${day}</span>
      ${inner}
    </div>`;
  }

  const dow = WD.map((w, i) => `<div class="${i === 6 ? 'sun' : ''}">${w}</div>`).join('');

  return `
  ${leadHTML()}
  <section>
    <div class="np-month">
      <button type="button" class="js-month" data-step="-1" aria-label="이전 달" ${idx(ym) > idx(RANGE.min) ? '' : 'disabled'}>‹</button>
      <div class="m-mid">
        <div class="m-ttl">${MONTH_EN[ym.m - 1]} ${ym.y}</div>
        <div class="m-sub">${ym.y}년 ${ym.m}월 · ${ACTORS[HONG].name} ${list.length}회차</div>
      </div>
      <button type="button" class="js-month" data-step="1" aria-label="다음 달" ${idx(ym) < idx(RANGE.max) ? '' : 'disabled'}>›</button>
    </div>
    <div class="np-cal">
      <div class="np-dow">${dow}</div>
      <div class="np-grid">${cells}</div>
    </div>
  </section>

  <section class="np-book">
    <a class="np-book-btn" href="https://ticket.melon.com/performance/index.htm?prodId=213480" target="_blank" rel="noopener">
      <span class="lbl">엘리자벳 예매</span><b>멜론티켓</b>
    </a>
    <a class="np-book-btn" href="https://tickets.interpark.com/goods/26009314" target="_blank" rel="noopener">
      <span class="lbl">엘리자벳 예매</span><b>NOL 티켓</b>
    </a>
  </section>

  <section class="np-links">
    <a class="np-book-btn" href="https://www.instagram.com/bollsar0211" target="_blank" rel="noopener" data-ext="actor-instagram">
      <span class="lbl">배우님 공식</span><b>인스타</b>
    </a>
    <a class="np-book-btn" href="https://cafe.daum.net/Bollsar" target="_blank" rel="noopener" data-ext="actor-fancafe">
      <span class="lbl">배우님 공식</span><b>팬카페</b>
    </a>
    <a class="np-book-btn" href="https://www.instagram.com/emk_musical" target="_blank" rel="noopener" data-ext="emk-instagram">
      <span class="lbl">제작사 EMK</span><b>인스타</b>
    </a>
  </section>`;
}

/* ═══ 목록형 ═══ */
function listHTML () {
  const all = hongPerfs().sort(cmpPerf);
  const upcoming = all.filter(p => !isPast(p));
  const past = all.filter(p => isPast(p));

  const rows = upcoming.length
    ? upcoming.map(p => entryHTML(p)).join('')
    : `<div class="np-empty"><div class="h">No upcoming entries.</div><div class="s">새 캐스팅표가 공개되면 반영됩니다</div></div>`;

  const pastBlock = past.length
    ? `<button type="button" class="np-past" id="pastToggle">${showPast ? '▲ 지난 회차 접기' : `▼ 지난 회차 ${past.length}건`}</button>` +
      (showPast ? past.map(p => entryHTML(p, 'past')).join('') : '')
    : '';

  return `<section>
    <div class="np-listhead">
      <h3>${ACTORS[HONG].name} 출연 회차</h3>
      <span class="cnt">예정 ${upcoming.length} · 지난 ${past.length}</span>
    </div>
    <div class="np-sec-body">${rows}${pastBlock}</div>
  </section>`;
}

/* ═══════════════════════════════════════════════════════════
   회차 상세 (하단 시트)
   ═══════════════════════════════════════════════════════════ */
function sheetHTML (p) {
  const diff = Math.round((new Date(p.y, p.m - 1, p.d) - new Date(TODAY.y, TODAY.m - 1, TODAY.d)) / 86400000);
  const dday = diff === 0 ? 'D-DAY' : diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff);

  const sameDay = hongPerfs().filter(q => q.y === p.y && q.m === p.m && q.d === p.d).sort(cmpPerf);
  const dayNav = sameDay.length > 1
    ? `<div class="np-sheet-switch">${sameDay.map(q => {
        const k = perfKey(q);
        return `<button type="button" class="np-sw js-sw${k === perfKey(p) ? ' on' : ''}" data-key="${k}">${q.t}</button>`;
      }).join('')}</div>`
    : '';

  const role = (hongRole(p) || {}).name || '';
  const went = loggedIn && !!recordFor(p);
  const kicker = [
    '<em class="cat">뮤지컬 회차</em>',
    p.history ? '<em class="np-mini hist">캐스팅 변경</em>' : '',
    went ? '<em class="np-mini went">✓ 담음</em>' : ''
  ].filter(Boolean).join('');

  const rows = ROLES.map(r => {
    const a = p.cast[r.id];
    if (!a) return '';
    const alts = r.actors.filter(x => x !== a);
    const altHTML = alts.length ? `<span class="alt">${alts.map(actorName).join(' · ')}</span>` : '';
    return `<tr><th>${r.name}</th><td><span class="on">${actorName(a)}</span>${altHTML}</td></tr>`;
  }).join('');

  const events = p.events || [];
  const evHTML = events.length
    ? `<div class="np-badges">${events.map(e => `<span class="np-badge${e.verified ? '' : ' unv'}">${e.label}${e.verified ? '' : ' · 미검증'}</span>`).join('')}</div>`
    : `<p class="np-noev">이벤트 정보 없음</p>`;

  const hist = p.history
    ? `<div class="np-hist"><b>캐스팅 변경</b>${p.history.role} 역 ${p.history.from} → ${p.history.to}
        <span>${p.history.when} 반영 · 예정 캐스팅은 이력에 보관됩니다</span></div>`
    : '';

  const rec = recordFor(p);
  const check = loggedIn
    ? `<div class="np-check">
        <button type="button" class="np-btn ${rec ? 'solid' : ''} js-check" aria-pressed="${!!rec}">${rec ? '✓ 이 회차 담음' : '이 회차 담기'}</button>
        ${rec ? '' : `<span class="hint">눌러서 관극 기록을 남기세요</span>`}
      </div>
      ${rec ? seatSelectHTML(rec) : ''}`
    : `<div class="np-check">
        <button type="button" class="np-btn ghost" disabled>이 회차 담기</button>
        <span class="hint">로그인하면 관극 기록과 좌석을 남길 수 있습니다</span>
      </div>`;

  return `
    <div class="np-sheet-head">
      <span>${dowShort(p)}요일 · ${dday}</span>
      <button type="button" class="np-x js-close" aria-label="닫기">✕</button>
    </div>
    <h3 class="np-sheet-ttl">${p.m}월 ${p.d}일 ${dowShort(p)}요일의 지면</h3>
    <div class="np-sheet-kicker">${kicker}</div>
    <p class="np-sheet-show">${WORK.title}${role ? ` <span>— ${role} 역</span>` : ''}</p>
    <p class="np-sheet-sub">${p.t} 시작${WORK.venue ? ' · ' + WORK.venue : ''}</p>
    ${dayNav}
    <div class="np-hr"></div>
    <table class="np-cast">
      <caption>이 회차 캐스팅</caption>
      <tbody>${rows}</tbody>
    </table>
    ${evHTML}${hist}${check}`;
}

function openSheet (p) {
  const wasOpen = !$('#sheet').hidden;   // 재바인딩(회차 전환·체크 갱신)이면 등장 애니메이션 생략
  sheetKey = perfKey(p);
  const wrap = $('#sheet');
  const body = $('#sheetBody');
  body.innerHTML = sheetHTML(p);
  wrap.hidden = false;

  body.querySelector('.js-close').addEventListener('click', closeSheet);
  body.querySelectorAll('.js-sw').forEach(b => b.addEventListener('click', () => {
    const np = perfFromKey(b.dataset.key);
    if (np) openSheet(np);          // 같은 날 다른 회차로 전환
  }));
  const c = body.querySelector('.js-check');
  if (c) c.addEventListener('click', () => {
    toggleCheck(p);
    const np = perfFromKey(sheetKey);
    if (np) openSheet(np);          // 시트 안 체크 상태 갱신
  });
  [['.js-sf', 'floor'], ['.js-sr', 'row'], ['.js-sn', 'no']].forEach(([sel, which]) => {
    const el = body.querySelector(sel);
    if (el) el.addEventListener('change', () => applySeatSelect(p, which));
  });

  document.removeEventListener('keydown', escCloseSheet);
  document.addEventListener('keydown', escCloseSheet);

  if (!MOTION || wasOpen) return;
  gsap.fromTo('#sheetBack', { opacity:0 }, { opacity:1, duration:.18, ease:EASE.out });
  gsap.fromTo('#sheetBody', { yPercent:100 }, { yPercent:0, duration:.34, ease:EASE.out });
}

function closeSheet () {
  const wrap = $('#sheet');
  if (wrap.hidden) return;
  document.removeEventListener('keydown', escCloseSheet);
  sheetKey = null;
  const done = () => { wrap.hidden = true; };
  if (!MOTION) return done();
  gsap.to('#sheetBack', { opacity:0, duration:.16 });
  gsap.to('#sheetBody', { yPercent:100, duration:.24, ease:EASE.in, onComplete:done });
}
function escCloseSheet (e) { if (e.key === 'Escape') closeSheet(); }

/* ═══ 관극 기록 ═══ */
function toggleCheck (p) {
  const key = perfKey(p);
  const existing = MY_RECORDS.find(r => r.key === key);
  if (existing) { MY_RECORDS = MY_RECORDS.filter(r => r.key !== key); removeRecordRemote(key); }
  else MY_RECORDS.push({ key, seat:null });
  track(existing ? 'unsave_perf' : 'save_perf', { had_existing:!!existing });
  saveRecords();
  skipAnim = true;
  render();
}

function setSeatForPerf (p, seatId) {
  const rec = MY_RECORDS.find(r => r.key === perfKey(p));
  if (!rec) return;
  rec.seat = seatId;
  track('set_seat', { has_seat:!!seatId });
  saveRecords();
  skipAnim = true;
  render();
}

/* ═══ 좌석 선택 — 층 · 열 · 번호 세 개의 선택지.
   층을 바꾸면 열 목록이, 열을 바꾸면 번호 목록이 그 층·열의 실제 좌석으로 갱신된다.
   여기서 고른 id가 정산판 배치도에 그대로 칠해진다. ═══ */
function seatSelectHTML (rec) {
  const w = rec.seat ? seatWhere(rec.seat) : null;
  const floor = floorById(w ? w.fid : '1') || SEAT_MAP.floors[0];
  const row   = floor.rows.find(r => r.r === (w && w.rlab)) || floor.rows[0];
  const seats = seatsInRow(floor, row);
  const curNo = rec.seat ? String(rec.seat).split('-')[2] : null;

  const opt = (v, label, on) => `<option value="${v}"${on ? ' selected' : ''}>${label}</option>`;

  return `<div class="np-seatsel">
    <span class="lbl">좌석</span>
    <select class="js-sf" aria-label="층">${
      SEAT_MAP.floors.map(f => opt(f.id, f.label, f.id === floor.id)).join('')}</select>
    <select class="js-sr" aria-label="열">${
      floor.rows.map(r => opt(r.r, r.r + '열', r.r === row.r)).join('')}</select>
    <select class="js-sn" aria-label="번호">${
      seats.map(s => opt(s.no, s.no + '번', String(s.no) === curNo)).join('')}</select>
  </div>`;
}

/* 선택이 바뀌면 그 자리를 기록에 바로 반영하고 시트를 다시 그린다.
   floor/row 가 바뀌면 하위 목록이 달라지므로 첫 좌석으로 맞춰 준다. */
function applySeatSelect (perf, changed) {
  const fid = $('.js-sf').value;
  const floor = floorById(fid);
  let rlab = $('.js-sr').value;
  if (changed === 'floor' || !floor.rows.some(r => r.r === rlab)) rlab = floor.rows[0].r;
  const row = floor.rows.find(r => r.r === rlab);
  const seats = seatsInRow(floor, row);
  let no = $('.js-sn').value;
  if (changed !== 'no' || !seats.some(s => String(s.no) === no)) no = seats[0].no;
  setSeatForPerf(perf, seatId(fid, rlab, no));
  const np = perfFromKey(sheetKey);
  if (np) openSheet(np);
}

/* ═══════════════════════════════════════════════════════════
   이벤트 바인딩
   ═══════════════════════════════════════════════════════════ */
function moveMonth (step) {
  const n = { y:ym.y, m:ym.m + step };
  if (n.m > 12) { n.m = 1; n.y++; }
  if (n.m < 1)  { n.m = 12; n.y--; }
  if (idx(n) < idx(RANGE.min) || idx(n) > idx(RANGE.max)) return;
  ym = n;
  sheetKey = null;
  closeSheet();
  gridFrom = step < 0 ? 'end' : 'start';
  render();
}

function bind () {
  $$('.np-vt button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.view === view) return;
    view = b.dataset.view;
    track('switch_view', { view });
    sheetKey = null;
    closeSheet();
    render();
  }));

  $$('.np-cell[data-day]').forEach(c => c.addEventListener('click', () => {
    const day = +c.dataset.day;
    const dPerfs = monthPerfs().filter(p => p.d === day).sort(cmpPerf);
    if (!dPerfs.length) return;
    track('open_perf', { from:'calendar' });
    openSheet(dPerfs[0]);   // 회차 있는 날 → 상세 모달 (같은 날 여러 회차면 모달 안에서 전환)
  }));

  $$('.np-entry').forEach(e => e.addEventListener('click', () => {
    const p = perfFromKey(e.dataset.key);
    if (!p) return;
    track('open_perf', { from:'list' });
    openSheet(p);
  }));

  $$('.np-book-btn').forEach(a => a.addEventListener('click', () => {
    if (a.dataset.ext) track('click_link', { target:a.dataset.ext });
    else track('click_booking', { vendor:(a.querySelector('b') || {}).textContent || '' });
  }));

  $$('.js-month').forEach(b => b.addEventListener('click', () => moveMonth(+b.dataset.step)));

  const pastToggle = $('#pastToggle');
  if (pastToggle) pastToggle.addEventListener('click', () => { showPast = !showPast; skipAnim = true; render(); });
}

/* ═══ 등장 · 재렌더 애니메이션 ═══ */
function enter () {
  document.documentElement.classList.remove('pre-anim');
  if (!MOTION) return;
  gsap.timeline()
    .from('.np-mast > *', { opacity:0, y:-8, duration:.5, stagger:.07 })
    .from('.np-nav > *',  { opacity:0, y:-6, duration:.4, stagger:.05 }, .12)
    .from('.np-main > *', { opacity:0, y:16, duration:.5, stagger:.1, clearProps:'all' }, .2);
}

function animateBody () {
  if (!MOTION || skipAnim) { skipAnim = false; return; }
  const items = $('#wrap').querySelectorAll('.np-cell[data-day], .np-entry');
  if (!items.length) return;
  gsap.from(items, {
    opacity:0, y:-4, duration:.28,
    stagger:{ amount:Math.min(items.length * .012, .35), from:gridFrom }
  });
  gridFrom = 'start';
}

$('#sheetBack').addEventListener('click', closeSheet);

/* ═══ 초기화 ═══ */
function updateTodayStamp () {
  $('#todayStamp').textContent =
    `${TODAY.y}.${String(TODAY.m).padStart(2,'0')}.${String(TODAY.d).padStart(2,'0')} (${WD_NAME[new Date(TODAY.y, TODAY.m - 1, TODAY.d).getDay()]})`;
}

updateTodayStamp();

window.addEventListener('todaychange', event => {
  const { previous, current } = event.detail;
  if (ym.y === previous.y && ym.m === previous.m) ym = { y:current.y, m:current.m };
  updateTodayStamp();
  skipAnim = true;
  render();
});
window.addEventListener('performancechange', () => {
  skipAnim = true;
  render();
});

if ('serviceWorker' in navigator) {
  const hadServiceWorker = !!navigator.serviceWorker.controller;
  let reloadingForUpdate = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadServiceWorker || reloadingForUpdate) return;
    reloadingForUpdate = true;
    window.location.reload();
  });
}

skipAnim = true;
render();
enter();

/* Supabase 로그인 — 세션이 확인되면 콜백으로 재렌더 */
mountAuth(isIn => { loggedIn = isIn; skipAnim = true; render(); });
</script>

<script src="pwa-install.js"></script>

</body>
