<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애배력 — 한글 폰트 비교 (로컬)</title>
<link rel="stylesheet" href="ref/fonts.css">
<style>
:root {
  --paper:#e9e3d5; --paper-3:#ded7c6;
  --ink:#17150f;
  --ink-72:rgba(23,21,15,.75); --ink-60:rgba(23,21,15,.66); --ink-55:rgba(23,21,15,.62);
  --ink-40:rgba(23,21,15,.4); --ink-28:rgba(23,21,15,.28); --ink-14:rgba(23,21,15,.14);
  --accent:#8f2e22;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:var(--paper); color:var(--ink); line-height:1.6;
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:14px;
  padding:26px 20px 90px;
}
.wrap { max-width:820px; margin:0 auto; }
h1 { font-family:"Playfair Display",serif; font-weight:900; font-size:24px; margin-bottom:8px; }
.lead { font-size:13px; line-height:1.8; color:var(--ink-72); }
.lead b { color:var(--accent); }

.stat { margin:14px 0 18px; padding:11px 14px; border:1px solid var(--ink-28); font-size:12px; line-height:1.9; }
.stat.good { border-color:#2f6b45; background:rgba(47,107,69,.07); }
.stat.bad  { border-color:var(--accent); background:rgba(143,46,34,.07); }
.stat .pill { display:inline-block; margin:2px 5px 2px 0; padding:1px 7px; border:1px solid var(--ink-28); font-size:11px; }
.stat .pill.no { border-color:var(--accent); color:var(--accent); }

.bar {
  position:sticky; top:0; z-index:5; display:flex; gap:8px; flex-wrap:wrap;
  margin-bottom:20px; padding:11px 14px; background:var(--paper);
  border:1px solid var(--ink-28); font-family:var(--mono); font-size:11px;
}
.bar button {
  border:1px solid var(--ink-40); background:none; color:var(--ink-60);
  cursor:pointer; font:inherit; padding:6px 11px;
}
.bar button[aria-pressed="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }

.grp-h {
  margin:24px 0 2px; padding-bottom:4px; border-bottom:2px solid var(--ink);
  font-family:"Playfair Display",serif; font-weight:700; font-size:15px;
}
.grp-h em { font-family:"Malgun Gothic",sans-serif; font-style:normal; font-weight:400;
  font-size:11px; color:var(--ink-55); margin-left:8px; }

.fb { margin-top:14px; border:1px solid var(--ink-28); background:rgba(255,255,255,.3); }
.fb-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 15px; border-bottom:1px solid var(--ink-28); background:rgba(23,21,15,.045); }
.fb-head .idx { font-weight:700; font-size:12px; width:21px; height:21px; flex:none;
  display:grid; place-items:center; border:1px solid var(--ink-40); }
.fb-head .nm { font-size:22px; line-height:1.1; }
.fb-head .sz { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--ink-55); }
.fb-note { padding:8px 15px 0; font-size:11.5px; line-height:1.65; color:var(--ink-60); }

.row { display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:baseline;
  padding:9px 15px; border-top:1px solid var(--ink-14); }
.row .k { font-family:var(--mono); font-size:9px; letter-spacing:.06em; color:var(--ink-55); }
.v.t26 { font-weight:700; font-size:26px; line-height:1.15; }
.v.t14 { font-size:14px; }
.v.t12 { font-size:12px; color:var(--ink-72); }
.v.t9  { font-size:9px; color:var(--ink-55); }
.v.t9 b { font-weight:700; color:var(--ink); }
body.boost .v.t9 { font-size:12px; }

footer { margin-top:26px; font-size:12.5px; line-height:1.9; color:var(--ink-72); }
footer code { font-family:var(--mono); font-size:12px; background:var(--paper-3); padding:1px 5px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>한글 폰트 비교</h1>
  <p class="lead">
    전부 <b>저장소 로컬 폰트</b>입니다 (CDN 불필요). 실제 신문·출판 조판에 쓰이는 순서로 묶었습니다.
    한국 신문사 지면 서체(조선일보명조·중앙명조 등)는 사내 전용이라 배포되지 않아,
    <b>같은 계보의 공개 서체</b>로 골랐습니다.
  </p>

  <div id="diag" class="stat">진단 중…</div>
  <div id="stat" class="stat">폰트 로드 확인 중…</div>

  <div class="bar">
    <button data-act="boost" aria-pressed="false">작은 글씨 9px →12px</button>
    <button data-act="crisp" aria-pressed="false">smoothing 끄기</button>
  </div>

  <div id="list"></div>

  <footer>
    번호 알려주시면 <code>index.html</code>·<code>settlement.html</code>에 적용하고,
    <b>안 쓰는 woff2 는 지웁니다</b> (지금 비교용으로 7MB 들어있음).
    본문과 헤드라인을 다르게 쓰고 싶으시면 “본문 N번 + 헤드라인 M번”으로 말씀해 주세요.
  </footer>
</div>

<script>
const G = [
  { h:'출판·신문 조판용', sub:'실제 인쇄물 본문에 쓰이는 계보', items:[
    { nm:'KoPub 바탕', ff:"'KoPubWorld Batang',serif", sz:'1.0MB', w:700,
      note:'<b>한국출판인회의</b>가 전자출판·인쇄 조판용으로 만든 공식 서체. 한국 책·신문 바탕체의 사실상 표준이고 상업 이용 무료입니다. 이 목록에서 “진짜 신문 활자”에 가장 가깝습니다.' },
    { nm:'나눔명조', ff:"'Nanum Myeongjo',serif", sz:'490KB', w:800,
      note:'네이버 배포. 신문·잡지 본문 명조로 가장 널리 쓰입니다. 800 굵기가 있어 헤드라인도 강합니다.' },
    { nm:'송명 (Song Myung)', ff:"'Song Myung',serif", sz:'307KB', w:400,
      note:'납활자 인쇄 느낌이 남아 있는 명조. 획이 살짝 불규칙해 옛 신문 지면 같습니다.' },
  ]},
  { h:'출판 계열 · 부드러운 쪽', sub:'책·매거진 느낌', items:[
    { nm:'고운바탕', ff:"'Gowun Batang',serif", sz:'483KB', w:700,
      note:'따뜻하고 부드러운 바탕체. 신문보다 단행본에 가까운 인상입니다.' },
    { nm:'Hahmlet', ff:"'Hahmlet',serif", sz:'168KB', w:700,
      note:'획 대비가 큰 편집용 세리프. 잡지 표제 느낌이라 개성이 가장 강합니다.' },
  ]},
  { h:'고딕', sub:'작은 글씨에서 가장 또렷 — 본문·라벨용', items:[
    { nm:'맑은 고딕 (시스템)', ff:"'Malgun Gothic',sans-serif", sz:'0KB', w:700,
      note:'윈도우 기본. 화면용 힌팅이 완벽해 9~11px에서 안 뭉갭니다. 다운로드가 없어 항상 즉시 뜹니다.' },
    { nm:'나눔고딕', ff:"'Nanum Gothic',sans-serif", sz:'333KB', w:700,
      note:'가장 무난하고 깔끔한 고딕. 신문 웹판 본문에 흔합니다.' },
    { nm:'Gothic A1', ff:"'Gothic A1',sans-serif", sz:'238KB', w:700,
      note:'기하학적이고 살짝 각진 고딕. 현재값과 확실히 다른 인상.' },
    { nm:'고운돋움', ff:"'Gowun Dodum',sans-serif", sz:'397KB', w:400,
      note:'획 굵기가 균일한 부드러운 고딕. 굵기가 400 하나뿐입니다.' },
  ]},
  { h:'제목 전용', sub:'본문 X — 헤드라인·제호에만', items:[
    { nm:'도현', ff:"'Do Hyeon',sans-serif", sz:'176KB', w:400,
      note:'굵고 단단한 디스플레이. 헤드라인 한 줄에 힘이 실립니다.' },
    { nm:'검은고딕', ff:"'Black Han Sans',sans-serif", sz:'186KB', w:400,
      note:'초굵은 제호용. 스포츠신문 1면 같은 인상.' },
    { nm:'주아', ff:"'Jua',sans-serif", sz:'360KB', w:400,
      note:'둥글둥글 친근한 폰트. 신문 톤을 완전히 바꾸고 싶을 때.' },
  ]},
];

const ROWS = (ff, w) => `
  <div class="row"><div class="k">제호 26px</div>
    <div class="v t26" style="font-family:${ff};font-weight:${w}">엘리자벳 6연 정산판</div></div>
  <div class="row"><div class="k">본문 14px</div>
    <div class="v t14" style="font-family:${ff}">커튼콜데이 등 회차 이벤트가 예정돼 있습니다.</div></div>
  <div class="row"><div class="k">데크 12px</div>
    <div class="v t12" style="font-family:${ff}">강홍석 출연 예정 회차입니다. 새 캐스팅·이벤트가 공개되면 이 자리에 먼저 실립니다.</div></div>
  <div class="row"><div class="k">작은 9px</div>
    <div class="v t9" style="font-family:${ff}">같은 자리에 여러 번 앉을수록 진해집니다 · 블루스퀘어 우리은행홀 · 이지수 · 카이 · <b>강홍석</b></div></div>`;

let n = 0;
document.getElementById('list').innerHTML = G.map(g => `
  <div class="grp-h">${g.h}<em>${g.sub}</em></div>
  ${g.items.map(f => `
    <div class="fb">
      <div class="fb-head">
        <span class="idx">${++n}</span>
        <span class="nm" style="font-family:${f.ff};font-weight:${f.w}">${f.nm}</span>
        <span class="sz">${f.sz}</span>
      </div>
      <p class="fb-note">${f.note}</p>
      ${ROWS(f.ff, f.w)}
    </div>`).join('')}
`).join('');

/* 로드 확인 — @font-face 를 실제 요청하고 FontFace.status 로 판정 */
const CHECK = [
  ['KoPubWorld Batang','엘리자벳'], ['Nanum Myeongjo','엘리자벳'], ['Song Myung','엘리자벳'],
  ['Gowun Batang','엘리자벳'], ['Hahmlet','엘리자벳'],
  ['Nanum Gothic','강홍석'], ['Gothic A1','강홍석'], ['Gowun Dodum','강홍석'],
  ['Do Hyeon','강홍석'], ['Black Han Sans','강홍석'], ['Jua','강홍석'],
  ['Playfair Display','Elisabeth'], ['UnifrakturMaguntia','Neue'], ['IBM Plex Mono','2026'],
];
Promise.allSettled(CHECK.map(([f,t]) => document.fonts.load(`16px "${f}"`, t))).then(() => {
  const st = fam => { let s='unloaded';
    document.fonts.forEach(ff => { if (ff.family.replace(/["']/g,'') === fam) {
      if (ff.status === 'loaded') s='loaded'; else if (ff.status === 'error' && s !== 'loaded') s='error'; } });
    return s; };
  const res = CHECK.map(([f]) => [f, st(f)]);
  const ok = res.filter(([,s]) => s === 'loaded').length;
  const box = document.getElementById('stat');
  box.className = 'stat ' + (ok === res.length ? 'good' : ok === 0 ? 'bad' : '');
  box.innerHTML = `<b>로컬 폰트 ${ok}/${res.length}</b>${
    ok === res.length ? ' — 전부 정상' :
    ok === 0 ? ' — 하나도 못 읽음. file:// 제약일 수 있습니다 (아래 참고).' : ' — 일부만'} `
    + res.map(([f,s]) => `<span class="pill${s==='loaded'?'':' no'}">${
        s==='loaded'?'✓':s==='error'?'✕':'·'} ${f}</span>`).join('');
});

/* ── 브라우저가 페이지 폰트를 무시하는지 감지 ──
   생김새가 완전히 다른 두 라틴 폰트를 실제로 그려 폭을 비교한다.
   폰트가 적용되면 폭이 크게 다르고, 브라우저가 강제로 한 폰트를 쓰면 똑같이 나온다. */
document.fonts.ready.then(() => setTimeout(() => {
  const c = document.createElement('canvas').getContext('2d');
  const w = f => { c.font = '40px ' + f; return c.measureText('Elisabeth Zeitung 2026').width; };
  const a = w('"Playfair Display", serif');        // 우아한 세리프
  const b = w('"UnifrakturMaguntia", serif');      // 흑자체 — 폭이 확 다름
  const mono = w('"IBM Plex Mono", monospace');
  const spread = Math.max(a, b, mono) - Math.min(a, b, mono);
  const box = document.getElementById('diag');
  if (spread < 3) {
    box.className = 'stat bad';
    box.innerHTML =
      `<b>⚠ 브라우저가 페이지 폰트를 무시하고 있습니다.</b><br>` +
      `서로 완전히 다른 세 폰트의 글자 폭이 전부 같게 측정됩니다 ` +
      `(${a.toFixed(1)} / ${b.toFixed(1)} / ${mono.toFixed(1)}px). 페이지·서버 문제가 아닙니다.<br><br>` +
      `<b>파이어폭스</b> — 설정 → 일반 → 글꼴 → <b>고급</b> →<br>` +
      `　“<b>내가 선택한 글꼴 대신 페이지에서 지정한 글꼴 사용 허용</b>” 을 <b>체크</b>하세요.<br>` +
      `<b>크롬·엣지</b> — 글꼴 변경 계열 확장(다크리더·난독증 폰트·접근성 확장)을 끄고 새로고침,<br>` +
      `　또는 시크릿 창(Ctrl+Shift+N)에서 이 주소를 다시 열어보세요.`;
  } else {
    box.className = 'stat good';
    box.innerHTML = `<b>✓ 페이지 폰트가 정상 적용됩니다.</b> ` +
      `세 폰트 폭이 서로 다르게 측정됩니다 (${a.toFixed(0)} / ${b.toFixed(0)} / ${mono.toFixed(0)}px).`;
  }
}, 400));

document.querySelector('.bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on);
  document.body.classList.toggle(b.dataset.act === 'boost' ? 'boost' : 'crisp', on);
});
</script>
</body>
</html>
