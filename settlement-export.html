<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>엘리자벳 · 2026 6연 정산판 미리보기</title>
<link rel="stylesheet" href="ref/fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1586px;height:992px;overflow:hidden;background:#130c1e;color:#f1e5cf}
body{font-family:"Cafe24 Ssurround Air","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:600}#board{position:relative;width:1586px;height:992px}
.backdrop{position:absolute;width:100%;height:100%}
.text,.group,.floor-label,.legend{position:absolute;text-align:center}
#cast{position:absolute;inset:0}.group.primary{transform:scale(.92);transform-origin:top left}.group.centered .actors{justify-content:center}.group.bottom{text-align:left}.group.bottom .role{font-size:11px;line-height:18px;margin-bottom:4px;white-space:nowrap;text-align:left;font-weight:400;letter-spacing:0}.group.bottom .actors{justify-content:flex-start;gap:4px}.group.bottom .actor{width:32px!important}.group.bottom .portrait{border:0;box-shadow:none;padding:0;background:transparent}.group.bottom .portrait::after{display:none}.separator{position:absolute;left:650px;top:213px;height:650px;border-left:1px solid rgba(213,182,106,.8)}.separator::before,.separator::after{content:"◆";position:absolute;left:-6px;color:#d5b66a;font-size:10px}.separator::before{top:-7px}.separator::after{bottom:-7px}
.subtitle{left:626px;top:178px;width:324px;font-size:20px;letter-spacing:2px}
.venue{left:209px;top:96px;width:325px;text-align:left;font-size:16px;line-height:1.7}
.period{margin-top:10px;font-size:13px;letter-spacing:.2px}
.tally{left:1112px;top:88px;width:358px;font-size:18px}.tally .value{font-size:24px;margin-top:5px}
.role{font-size:16px;line-height:24px;margin:0 0 8px;font-weight:400;letter-spacing:.8px;color:#f2dfbe;text-shadow:0 2px 5px #130c1e}
.actors{display:flex;justify-content:space-around;gap:6px}.actor{text-align:center;flex:none}
.portrait{position:relative;border:2px solid #aa8d60;box-shadow:inset 0 0 0 1px #f5dba1,0 0 0 1px #382737;background:#18151d;padding:2px;margin:0 auto}
.portrait::after{content:"";position:absolute;inset:-2px;pointer-events:none;background:linear-gradient(#e5c48a,#e5c48a) left top/8px 2px no-repeat,linear-gradient(#e5c48a,#e5c48a) right top/8px 2px no-repeat,linear-gradient(#e5c48a,#e5c48a) left bottom/8px 2px no-repeat,linear-gradient(#e5c48a,#e5c48a) right bottom/8px 2px no-repeat}
canvas{display:block;width:100%;height:100%}.name{font-size:12px;line-height:18px;margin-top:3px;letter-spacing:.7px;white-space:nowrap}.count{font-size:12px;line-height:17px;letter-spacing:.8px;color:#eee0d0}
.legend{left:1091px;top:162px;width:400px;display:flex;justify-content:center;gap:18px;font-size:14px;align-items:center}.legend label{display:flex;align-items:center;gap:7px;white-space:nowrap}.check{display:inline-block;width:18px;height:18px;border:1px solid #c5a778;box-shadow:inset 0 0 0 3px #190f25;background:var(--visit-color,transparent)}
.pair-box{position:absolute;left:30px;top:778px;width:600px;height:108px;text-align:center;transform:scale(.92);transform-origin:top left}.pair-box[hidden]{display:none}.pair-box h2{padding:0 22px;font-size:13px;line-height:18px;margin:0 0 5px;font-weight:400;color:#f2dfbe}.pair-list{display:grid;gap:3px;padding:0 22px}.pair-row{height:18px;display:grid;grid-template-columns:1fr 124px;gap:18px;align-items:center;font-size:11px;line-height:18px}.pair-name{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pair-count{text-align:right;font-family:"IBM Plex Mono",monospace;color:#eee0d0}
.seat-panel{position:absolute;left:660px;top:228px;width:912px;height:656px;color:#e8dcc9}.stage-vector{width:86%;height:28px;margin:0 auto 5px;border:1px solid rgba(232,220,201,.7);border-radius:50% 50% 4px 4px/80% 80% 4px 4px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:26px;letter-spacing:.4em}.seat-floors{display:flex;flex-direction:column;gap:18px}.seat-floor+.seat-floor::before{content:"";position:absolute;top:-9px;left:40px;right:0;border-top:1px solid rgba(213,182,106,.55)}.seat-floor{position:relative}.seat-floor-title{position:absolute;left:1px;top:50%;transform:translateY(-50%);width:35px;font-size:17px;text-align:left}.seat-floor-title::after{content:"◆";display:block;margin-top:3px;font-size:8px;color:#d5b66a}.seat-rows{display:flex;flex-direction:column;align-items:center}.seat-row{display:grid;height:15px;align-items:center}.seat-cell{width:15px;height:15px;align-self:center;justify-self:center;box-shadow:0 0 0 1px rgba(232,220,201,.78);font-family:"IBM Plex Mono",monospace;font-size:6.5px;font-weight:600;line-height:1;text-align:center;color:#e5d7c3;background:rgba(32,21,43,.9);display:grid;place-items:center;padding:0;grid-row:1}.seat-cell.on{box-shadow:0 0 0 1px #f1e5cf,inset 0 0 0 1px #f1e5cf;z-index:1}.row-label{font-family:"IBM Plex Mono",monospace;font-size:7.5px;line-height:1;text-align:center;color:#dfccb0;white-space:nowrap;z-index:2;display:grid;place-items:center;align-self:stretch;grid-row:1}
.seat-row{grid-template-rows:15px}
.seat-cell{width:16px;height:16px;border:1px solid rgba(232,220,201,.78);box-shadow:none;align-self:start;justify-self:start}
.seat-cell.on{border:2px solid #f1e5cf;box-shadow:none}
</style>
</head>
<body>
<main id="board">
  <img class="backdrop" src="ref/settlement-export-bg.png" alt="엘리자벳 궁전 배경과 금색 테두리">
  <div class="text subtitle">2026 6연 정산판</div>
  <div class="text venue">블루스퀘어 우리은행홀<div class="period">공연 기간<br>2026.08.16 ~ 2026.11.15</div></div>
  <div class="text tally">관람횟수 / 총 공연 횟수<div class="value" id="total"></div></div>
  <div id="cast"></div>
  <section class="pair-box" id="pair-box" aria-label="페어 조합 최대 4개" hidden>
    <h2>페어 조합</h2>
    <div class="pair-list" id="pair-list"></div>
  </section>
  <i class="separator" aria-hidden="true"></i>
  <section class="seat-panel" aria-label="좌석배치도">
    <div class="stage-vector">STAGE</div>
    <div class="seat-floors" id="seat-floors"></div>
  </section>
  <div class="legend" aria-label="관람 횟수별 지정 색상">
    <label>1회<span class="check" data-level="1"></span></label>
    <label>2회<span class="check" data-level="2"></span></label>
    <label>3회<span class="check" data-level="3"></span></label>
    <label>4회<span class="check" data-level="4"></span></label>
  </div>
</main>
<script src="ref/html2canvas-1.4.1.min.js"></script>
<script src="data.js"></script>
<script>
// Only crop and scale original photos. No filters, retouching, or generated faces.
// Crop: source x, y, width as fractions; height is derived to keep an exact 3:4 ratio.
const crop = {
  '린아':[.09,0,.79], '박지연':[.20,.025,.65], '이지혜':[.12,0,.79], '이지수':[.12,0,.79],
  '카이':[.265,0,.365], '김준수':[.21,.13,.42], '서경수':[.34,.03,.46], '고은성':[.33,.08,.46],
  '박은태':[.13,.015,.68], '강홍석':[.08,0,.77], '노윤':[.19,0,.72],
  '민영기':[.32,.03,.40], '박민성':[.28,.025,.42], '주아':[.29,.015,.43], '서지영':[.26,.055,.48],
  '김우성':[.24,.025,.44], '장윤석':[.26,.025,.44], '김대호':[.21,.025,.44], '장예원':[.31,.025,.46]
};
const actor = (name, file=name) => ({name,file:file+'.jpg',crop:crop[name]||[.26,.045,.48]});
const named = (prefix,names) => names.map((name,i)=>actor(name,prefix+(i+1)));
const groups = [
  {role:'엘리자벳',primary:true,x:32,y:229,w:327,pw:72,actors:['린아','박지연','이지혜','이지수'].map(n=>actor(n))},
  {role:'죽음',primary:true,x:348,y:229,w:319,pw:72,actors:['카이','김준수','서경수','고은성'].map(n=>actor(n))},
  {role:'루이지 루케니',primary:true,centered:true,x:32,y:431,w:327,pw:64,actors:['박은태','강홍석','노윤'].map(n=>actor(n))},
  {role:'프란츠 요제프',primary:true,centered:true,x:348,y:431,w:319,pw:64,actors:['민영기','박민성'].map(n=>actor(n))},
  {role:'소피 대공비',primary:true,centered:true,x:32,y:625,w:327,pw:64,actors:['주아','서지영'].map(n=>actor(n))},
  {role:'루돌프',primary:true,centered:true,x:348,y:625,w:319,pw:64,actors:['김우성','장윤석'].map(n=>actor(n))},
  {role:'막스 공작',bottom:true,hideNames:true,x:20,y:895,w:32,pw:24,actors:[actor('김대호')]},
  {role:'루도비카 · 볼프 부인',bottom:true,hideNames:true,x:75,y:895,w:32,pw:24,actors:[actor('장예원')]},
  {role:'엘리자벳의 측근들',bottom:true,hideNames:true,x:200,y:895,w:68,pw:24,actors:named('엘리자벳의 측근들',['서예림','박선정'])},
  {role:'황실 세력가들',bottom:true,hideNames:true,x:320,y:895,w:212,pw:24,actors:['유철호','이도경','김낙현','채성욱','안준혁','이동윤'].map((n,i)=>actor(n,i===1?'황실세력가들2':'황실 세력가들'+(i+1)))},
  {role:'어린 루돌프',bottom:true,hideNames:true,x:555,y:895,w:104,pw:24,actors:named('어린 루돌프',['박지호','박태온','한라온'])},
  {role:'앙상블',bottom:true,hideNames:true,x:680,y:895,w:536,pw:24,actors:named('앙상블',['전선진','김경태','송주영','장여진','김요한','오태희','오민석','이슬아','전주일','곽동기','한수인','홍유진','김동훈','정인서','박찬희'])},
  {role:'죽음의 천사들',bottom:true,hideNames:true,x:1240,y:895,w:248,pw:24,actors:named('죽천',['박세형','박상봉','함승윤','조승민','김규범','배형빈','정규진'])}
];
const allActors=groups.flatMap(g=>g.actors);
const loads=[];
const loadImage=src=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src;});
loads.push(loadImage('ref/settlement-export-bg.png'));
const cast=document.getElementById('cast');
for(const group of groups){
  const section=document.createElement('section');section.className='group'+(group.primary?' primary':'')+(group.centered?' centered':'')+(group.bottom?' bottom':'');
  Object.assign(section.style,{left:group.x+'px',top:group.y+'px',width:group.w+'px'});
  const title=document.createElement('h2');title.className='role';title.textContent=group.role;section.append(title);
  const columns=group.columns||group.actors.length;
  for(let start=0;start<group.actors.length;start+=columns){
    const row=document.createElement('div');row.className='actors';
    if(start){row.style.marginTop='6px';row.style.justifyContent='center';row.style.gap=(group.w/columns-group.pw-8)+'px';}
    for(const item of group.actors.slice(start,start+columns)){
      const card=document.createElement('div');card.className='actor';card.style.width=group.w/columns-6+'px';
      const frame=document.createElement('div');frame.className='portrait';frame.style.width=group.pw+8+'px';frame.style.height=group.pw*4/3+8+'px';
      const canvas=document.createElement('canvas');canvas.width=group.pw*4;canvas.height=group.pw*4/3*4;canvas.setAttribute('aria-label',item.name+' 원본 사진');frame.append(canvas);card.append(frame);
      if(!group.hideNames){const label=document.createElement('div');label.className='name';label.textContent=item.name;card.append(label);}
      const id=Object.keys(ACTORS).find(id=>ACTORS[id].name===item.name);
      if(id){const count=document.createElement('div');count.className='count';count.dataset.actor=id;card.append(count);}
      row.append(card);
      loads.push(new Promise((resolve,reject)=>{
        const img=new Image();img.onload=()=>{
          const [x,y,w]=item.crop,sw=w*img.width,sh=sw*4/3;
          if(x+w>1.001||y*img.height+sh>img.height+.01){reject(new Error('Invalid crop: '+item.file));return;}
          const ctx=canvas.getContext('2d');ctx.imageSmoothingQuality='high';
          ctx.drawImage(img,x*img.width,y*img.height,sw,sh,0,0,canvas.width,canvas.height);canvas.dataset.source=item.file;resolve();
        };img.onerror=()=>reject(new Error('Missing photo: '+item.file));img.src='cast/'+encodeURIComponent(item.file);
      }));
    }section.append(row);
  }cast.append(section);
}
const pairList=document.getElementById('pair-list');
const pairBox=document.getElementById('pair-box');
window.setPairCombinations=(pairs=[])=>{
  pairBox.hidden=!pairs.length;
  pairList.replaceChildren();
  for(const pair of pairs.slice(0,4)){
    const row=document.createElement('div');row.className='pair-row';
    const names=Array.isArray(pair)?pair:(pair.names||[]);
    const name=document.createElement('span');name.className='pair-name';name.textContent=names.slice(0,4).join(' · ');row.append(name);
    const count=document.createElement('span');count.className='pair-count';
    if(!Array.isArray(pair))count.textContent=(pair.watched||'　')+' / '+pair.total;
    row.append(count);
    pairList.append(row);
  }
};
window.setPairCombinations();
const seatFloors=document.getElementById('seat-floors');
for(const floor of SEAT_MAP.floors){
  const meta=floorGrid(floor),wrap=document.createElement('section');wrap.className='seat-floor';
  const occupied=new Set(floor.rows.flatMap(row=>seatRowCells(floor,row).map(cell=>cell.gc)));
  const aisleCols=new Set(meta.labelGc.slice(1,-1).flatMap(gc=>Array.from({length:AISLE_W},(_,i)=>gc+i)));
  const tracks=Array.from({length:meta.cols},(_,i)=>occupied.has(i+1)?'15px':aisleCols.has(i+1)?'5px':'0px').join(' ');
  wrap.innerHTML=`<div class="seat-floor-title">${floor.label}</div><div class="seat-rows"></div>`;
  const rowsEl=wrap.querySelector('.seat-rows');
  for(const row of floor.rows){
    const line=document.createElement('div');line.className='seat-row';line.style.gridTemplateColumns=tracks;
    for(const gc of meta.labelGc.slice(1,-1)){
      const label=document.createElement('span');label.className='row-label';label.style.gridColumn=`${gc}/span ${AISLE_W}`;label.textContent=row.r;line.append(label);
    }
    for(const cell of seatRowCells(floor,row)){
      const seat=document.createElement('span');seat.className='seat-cell';seat.dataset.seat=cell.id;seat.dataset.number=cell.no;seat.style.gridColumn=cell.gc;seat.textContent=Number(cell.no)%5===0?cell.no:'';seat.setAttribute('aria-label',`${floor.label} ${row.r}열 ${cell.no}번`);line.append(seat);
    }
    rowsEl.append(line);
  }
  seatFloors.append(wrap);
}
// Preview-only input boundary: the service can pass its selected visitColors and filtered performances.
window.setSettlementPreview=({visitColors={},records=[],performances=PERFS}={})=>{
  const palette=Object.fromEntries(SEAT_COLORS.map(c=>[c.id,c.hex]));
  for(const swatch of document.querySelectorAll('.check')){
    const id=visitColors[swatch.dataset.level];
    swatch.style.setProperty('--visit-color',palette[id]||'transparent');
  }
  const visits=new Map();
  for(const item of records){
    const seat=item.rec?.seat||item.seat;
    if(seat)visits.set(seat,(visits.get(seat)||0)+1);
  }
  for(const seat of document.querySelectorAll('.seat-cell')){
    const level=Math.min(visits.get(seat.dataset.seat)||0,4);
    const color=level&&palette[visitColors[level]];
    seat.classList.toggle('on',!!level);
    seat.style.background=color||'rgba(32,21,43,.9)';
    seat.style.color=color?'#160f1f':'#e5d7c3';
    seat.textContent=(level||Number(seat.dataset.number)%5===0)?seat.dataset.number:'';
  }
  document.getElementById('total').textContent=(records.length||'　')+' / '+performances.length;
  for(const count of document.querySelectorAll('[data-actor]')){
    const id=count.dataset.actor;
    const total=performances.filter(p=>Object.values(p.cast).includes(id)).length;
    const watched=records.filter(p=>Object.values((p.perf||p).cast||{}).includes(id)).length;
    count.textContent=(watched||'　')+' / '+total;
  }
};
window.setSettlementPreview({visitColors:{1:'plum',2:'rose',3:'gold',4:'moss'}});
window.previewReady=Promise.all([...loads,document.fonts.ready]).then(()=>{
  if(allActors.length!==52||new Set(allActors.map(a=>a.file)).size!==52)throw Error('Cast inventory mismatch');
  if(new URLSearchParams(location.search).has('verify')){
    const assert=(ok,message)=>{if(!ok)throw Error(message);};
    const chips=[...document.querySelectorAll('.check')];
    window.setSettlementPreview({visitColors:{1:'moss',2:'plum',3:'rose',4:'gold'},records:[PERFS[0]]});
    assert(chips.every((chip,i)=>getComputedStyle(chip).getPropertyValue('--visit-color').trim()===['#B4D49E','#CBABDD','#EBA0A6','#EFDD97'][i]),'Selected color mapping');
    assert(document.getElementById('total').textContent==='1 / '+PERFS.length,'Watched count');
    window.setSettlementPreview();
    assert(chips.every(chip=>getComputedStyle(chip).getPropertyValue('--visit-color').trim()==='transparent'),'Unselected colors must stay empty');
    assert([...document.querySelectorAll('.count')].every(count=>count.textContent.trim().startsWith('/')),'Unwatched numerators must stay blank');
    const unwanted=['2026 관람 정산판','나의 관람 기록','나의 객석','관람 좌석','배우 출연 회차','SEATING RECORD','DAS MUSICAL','\uFFFD'];
    assert(unwanted.every(text=>!document.getElementById('board').innerText.includes(text)),'Removed text or encoding error');
    assert(document.fonts.check('16px "Cafe24 Ssurround Air"','엘리자벳'),'Service body font');
    assert([...document.querySelectorAll('.group')].filter(group=>['엘리자벳의 측근들','황실 세력가들','어린 루돌프','앙상블','죽음의 천사들'].includes(group.querySelector('.role').textContent)).every(group=>!group.querySelector('.name')),'Lower cast names must stay hidden');
    window.setPairCombinations([{names:['린아','카이'],watched:1,total:3}]);
    assert(!pairBox.hidden&&pairList.children.length===1&&pairList.firstElementChild.children.length===2,'Plain pair text and counts');
    window.setPairCombinations();
    assert(pairBox.hidden&&!document.getElementById('board').innerText.includes('페어 조합'),'Empty pair section must be absent');
    const expectedSeats=SEAT_MAP.floors.reduce((sum,floor)=>sum+floor.rows.reduce((n,row)=>n+seatRowCells(floor,row).length,0),0);
    assert(document.querySelectorAll('.seat-cell').length===expectedSeats,'Every seat must render from service data');
    assert([...document.querySelectorAll('.seat-cell')].every(seat=>/층 .+열 .+번/.test(seat.getAttribute('aria-label'))),'Seat row and number labels');
    assert([...document.querySelectorAll('.row-label')].every(label=>Math.abs(label.getBoundingClientRect().top-label.closest('.seat-row').getBoundingClientRect().top)<.5),'Row labels align with their own seat row');
    assert([...document.querySelectorAll('.seat-row')].every(row=>Math.abs(row.getBoundingClientRect().top-row.querySelector('.seat-cell').getBoundingClientRect().top)<.5),'Seats stay on the labeled row');
    assert(document.querySelector('.stage-vector').textContent==='STAGE','Stage label');
    assert([...document.querySelectorAll('.group.bottom .portrait')].every(frame=>getComputedStyle(frame).borderTopWidth==='0px'),'Lower gold frames removed');
    assert(['김대호','장예원'].every(name=>![...document.querySelectorAll('.group.bottom .name')].some(label=>label.textContent===name)),'Bottom actor names removed');
    window.setSettlementPreview({visitColors:{1:'plum',2:'rose',3:'gold',4:'moss'}});
  }
  document.body.dataset.verified='PASS: photos; crops; font; pairs; sharp seats; row and seat labels; stage; lower frames and names';
}).catch(error=>{document.body.dataset.verified='FAIL: '+error.message;throw error;});

window.exportSettlementPng=async()=>{
  await window.previewReady;
  const canvas=await html2canvas(document.getElementById('board'),{
    scale:2,width:1586,height:992,backgroundColor:null,logging:false,useCORS:false
  });
  return await new Promise((resolve,reject)=>
    canvas.toBlob(blob=>blob?resolve(blob):reject(Error('PNG encoding failed')),'image/png')
  );
};
</script>
</body>
</html>
