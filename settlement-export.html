<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>엘리자벳 · 2026 6연 정산판 미리보기</title>
<link rel="stylesheet" href="themes/elisabeth-2026-6th-lucheni/fonts/fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1586px;height:992px;overflow:hidden;background:#130c1e;color:#f1e5cf}
body{font-family:"Cafe24 Ssurround Air","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:600}#board{position:relative;width:1586px;height:992px}
.backdrop{position:absolute;width:100%;height:100%}
.text,.group,.floor-label,.legend{position:absolute;text-align:center}
/* 원본 배경의 세 번째 선(y1452~1457)만 바로 위 질감으로 덮는다. */
#cast{position:absolute;inset:0}#cast::before{content:"";position:absolute;left:38px;top:726px;width:612px;height:3px;background:url(themes/elisabeth-2026-6th-lucheni/assets/settlement/settlement-export-background.png) -38px -720px/1586px 992px no-repeat}.group.primary{transform:scale(.92);transform-origin:top left}.group.centered .actors{justify-content:center}.group.compact .actors{justify-content:center;gap:12px}.group.compact .actor{width:72px!important}.group.bottom{text-align:left}.group.bottom .role{font-size:11px;line-height:18px;margin-bottom:4px;white-space:nowrap;text-align:left;font-weight:400;letter-spacing:0}.group.bottom .actors{justify-content:flex-start;gap:4px}.group.bottom .actor{width:32px!important}.group.bottom .portrait{border:0;box-shadow:none;padding:0;background:transparent}.group.bottom .portrait::after{display:none}.separator{position:absolute;left:650px;top:213px;height:650px;border-left:1px solid rgba(213,182,106,.8)}.separator::before,.separator::after{content:"◆";position:absolute;left:-6px;color:#d5b66a;font-size:10px}.separator::before{top:-7px}.separator::after{bottom:-7px}
.subtitle{left:626px;top:178px;width:324px;font-size:20px;letter-spacing:2px}
.venue{left:209px;top:96px;width:325px;text-align:left;font-size:16px;line-height:1.7}
.period{margin-top:10px;font-size:13px;letter-spacing:.2px}
.tally{left:1112px;top:88px;width:358px;font-size:18px}.tally .value{font-size:24px;margin-top:5px}
.role{font-size:16px;line-height:24px;margin:0 0 8px;font-weight:400;letter-spacing:.8px;color:#f2dfbe;text-shadow:0 2px 5px #130c1e}
.actors{display:flex;justify-content:space-around;gap:6px}.actor{text-align:center;flex:none}
.portrait{position:relative;border:2px solid #aa8d60;box-shadow:inset 0 0 0 1px #f5dba1,0 0 0 1px #382737;background:#18151d;padding:2px;margin:0 auto}
.portrait::after{content:"";position:absolute;inset:-2px;pointer-events:none;background:linear-gradient(#e5c48a,#e5c48a) left top/8px 2px no-repeat,linear-gradient(#e5c48a,#e5c48a) right top/8px 2px no-repeat,linear-gradient(#e5c48a,#e5c48a) left bottom/8px 2px no-repeat,linear-gradient(#e5c48a,#e5c48a) right bottom/8px 2px no-repeat}
canvas{display:block;width:100%;height:100%}.name{font-size:12px;line-height:18px;margin-top:3px;letter-spacing:.7px;white-space:nowrap}.count{font-size:12px;line-height:17px;letter-spacing:.8px;color:#eee0d0}
.legend{left:1091px;top:162px;width:400px;display:flex;justify-content:center;gap:18px;font-size:14px;align-items:center}.legend label{display:flex;align-items:center;gap:7px;white-space:nowrap}.check{display:inline-block;width:18px;height:18px;border:1px solid #c5a778;box-shadow:inset 0 0 0 3px #190f25;background:var(--visit-color,transparent)}
.pair-box{position:absolute;left:458px;top:625px;width:190px;height:145px;text-align:center}.pair-box[hidden]{display:none}.pair-box h2{font-size:15px;line-height:22px;margin:0 0 8px;font-weight:400;color:#f2dfbe}.pair-list{display:grid;grid-template-columns:1fr;gap:4px;align-items:start}.pair-row{min-width:0;height:18px;display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px;align-items:center;font-size:8px;line-height:11px}.pair-name{text-align:left;overflow:visible;text-overflow:clip;white-space:nowrap;word-break:keep-all;line-height:11px}.pair-count{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:9px;line-height:12px;color:#eee0d0}
.seat-panel{position:absolute;left:660px;top:228px;width:912px;height:656px;color:#e8dcc9}.stage-vector{width:86%;height:28px;margin:0 auto 5px;border:1px solid rgba(232,220,201,.7);border-radius:50% 50% 4px 4px/80% 80% 4px 4px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:26px;letter-spacing:.4em}.seat-floors{display:flex;flex-direction:column;gap:18px}.seat-floor+.seat-floor::before{content:"";position:absolute;top:-9px;left:40px;right:0;border-top:1px solid rgba(213,182,106,.55)}.seat-floor{position:relative}.seat-floor-title{position:absolute;left:1px;top:50%;transform:translateY(-50%);width:35px;font-size:17px;text-align:left}.seat-floor-title::after{content:"◆";display:block;margin-top:3px;font-size:8px;color:#d5b66a}.seat-rows{display:flex;flex-direction:column;align-items:center}.seat-row{display:grid;height:16px;align-items:center}.seat-cell{width:15px;height:15px;align-self:center;justify-self:center;box-shadow:0 0 0 1px rgba(232,220,201,.78);font-family:"IBM Plex Mono",monospace;font-size:6.5px;font-weight:600;line-height:1;text-align:center;color:#e5d7c3;background:rgba(32,21,43,.9);display:grid;place-items:center;padding:0;grid-row:1}.seat-cell.on{box-shadow:0 0 0 1px #f1e5cf,inset 0 0 0 1px #f1e5cf;z-index:1}.row-label{font-family:"IBM Plex Mono",monospace;font-size:7.5px;line-height:1;text-align:center;color:#dfccb0;white-space:nowrap;z-index:2;display:grid;place-items:center;align-self:stretch;grid-row:1}
.seat-row{grid-template-rows:16px}
.seat-cell{width:16px;height:16px;border:1px solid rgba(232,220,201,.78);box-shadow:none;align-self:start;justify-self:start}
.seat-cell.on{border:2px solid #f1e5cf;box-shadow:none}

/* seat geometry v2
   공유 경계는 한 번만 그린다.
   하단 캐스팅은 모든 행을 동일한 gap으로 중앙 정렬한다. */
.group.bottom {
  text-align:center;
}
.group.bottom .role {
  text-align:center;
}
.group.bottom .actors {
  justify-content:center;
  gap:4px;
}

.seat-row {
  grid-template-rows:16px;
  height:16px;
  align-items:stretch;
}

.seat-cell {
  width:16px;
  height:16px;
  align-self:stretch;
  justify-self:stretch;
  box-shadow:none;

  --seat-line:rgba(232,220,201,.78);

  border:1px solid transparent;
  border-left-color:var(--seat-line);
  border-top-color:var(--seat-line);
}

/* 관람좌석도 굵기를 키우지 않고 색만 선명하게 */
.seat-cell.on {
  --seat-line:#f1e5cf;
  border:1px solid transparent;
  border-left-color:var(--seat-line);
  border-top-color:var(--seat-line);
  box-shadow:none;
}

/* 인접 좌석이 없는 면만 외곽선 추가 */
.seat-cell.edge-r,
.seat-cell.on.edge-r {
  border-right-color:var(--seat-line);
}

.seat-cell.edge-b,
.seat-cell.on.edge-b {
  border-bottom-color:var(--seat-line);
}

/* Export seat cells provide geometry/fill only. */
.seat-cell, .seat-cell.on { border:0 !important; box-shadow:none !important; }
.seat-rows { position:relative; }
</style>
</head>
<body>
<main id="board">
  <img class="backdrop" src="themes/elisabeth-2026-6th-lucheni/assets/settlement/settlement-export-background.png" alt="엘리자벳 궁전 배경과 금색 테두리">
  <div class="text subtitle">2026 6연 정산판</div>
  <div class="text venue">블루스퀘어 우리은행홀<div class="period">공연 기간<br>2026.08.16 ~ 2026.11.15</div></div>
  <div class="text tally">관람횟수 / 총 공연 횟수<div class="value" id="total"></div></div>
  <div id="cast"></div>
  <section class="pair-box" id="pair-box" aria-label="페어 조합 최대 4개" hidden>
    <h2>페어 조합</h2>
    <div class="pair-list" id="pair-list"></div>
  </section>
  <i class="separator" aria-hidden="true"></i>
  <section class="seat-panel" aria-label="좌석배치도">
    <div class="stage-vector">STAGE</div>
    <div class="seat-floors" id="seat-floors"></div>
  </section>
  <div class="legend" aria-label="관람 횟수별 지정 색상">
    <label>1회<span class="check" data-level="1"></span></label>
    <label>2회<span class="check" data-level="2"></span></label>
    <label>3회<span class="check" data-level="3"></span></label>
    <label>4회<span class="check" data-level="4"></span></label>
  </div>
</main>
<script src="assets/common/html2canvas-1.4.1.min.js"></script>
<script src="data.js"></script>
<script src="seat-lines.js"></script>
<script src="settlement-export.js"></script>
</body>
</html>
