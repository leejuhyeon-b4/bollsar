<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>킹키부츠 · 2025–2026 7연 정산판 미리보기</title>
<link id="settlementExportThemeFonts" rel="stylesheet">
<link id="settlementExportThemeStylesheet" rel="stylesheet">
</head>
<body>
<main id="board">
  <img class="backdrop" alt="흰 종이를 담은 갈색 이력서 파일">
    <div class="resume-clip" aria-hidden="true">
    <img class="resume-clip-loop" src="themes/kinky-boots-2025-2026-7th-lola/assets/settlement/kinky-clip-inner-loop.svg" alt="">
  </div>
  <header class="kb-export-header">
    <img class="resume-logo" src="themes/kinky-boots-2025-2026-7th-lola/assets/settlement/kinky-title-red-glitter.png" alt="킹키부츠">
    <div class="text subtitle">2025–2026 7연 정산판</div>
    <div class="text venue">서울 · 샤롯데씨어터</div>
    <div class="text tally">관람 이력 / 총 회차<div class="value" id="total"></div></div>
    <div id="regional-stats" aria-label="지방 공연 관람 횟수와 총 회차"></div>
    <div class="resume-photo">
      <img src="themes/kinky-boots-2025-2026-7th-lola/assets/settlement/kinky-id-photo.jpg" alt="롤라 증명사진">
    </div>
    <span class="accepted-stamp">ACCEPTED</span>
    <dl class="resume-details"><div><dt>이름</dt><dd>사이먼</dd></div><div><dt>활동명</dt><dd>롤라</dd></div><div><dt>거주지</dt><dd>런던</dd></div><div><dt>배정 직무</dt><dd class="designer-handwriting">디자이너</dd></div></dl>
  </header>
  <div id="cast"></div>
  <section class="pair-box" id="pair-box" aria-label="페어 조합 최대 4개" hidden>
    <h2>페어 조합</h2>
    <div class="pair-list" id="pair-list"></div>
  </section>
  <i class="separator" aria-hidden="true"></i>
  <section class="seat-panel" aria-label="좌석배치도">
    <div class="stage-vector">STAGE</div>
    <div class="seat-floors" id="seat-floors"></div>
  </section>
  <div class="legend" aria-label="관람 횟수별 지정 색상">
    <label>1회<span class="check" data-level="1"></span></label>
    <label>2회<span class="check" data-level="2"></span></label>
    <label>3회<span class="check" data-level="3"></span></label>
    <label>4회<span class="check" data-level="4"></span></label>
  </div>
</main>
<script src="assets/common/html2canvas-1.4.1.min.js"></script>
<script src="productions/kinky-boots-2025-2026-7th/data/schedule.js"></script>
<script src="productions/kinky-boots-2025-2026-7th/data/seat-map.js"></script>
<script src="data.js"></script>
<script src="theme-registry.js?v=kinky-resume-v7"></script>
<script src="seat-lines.js"></script>
<script src="themes/kinky-boots-2025-2026-7th-lola/assets/settlement/portrait-crops.js"></script>
<script src="settlement-export.js?v=kinky-resume-v12"></script>
</body>
</html>
